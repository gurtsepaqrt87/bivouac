     v5.16.14 = version diagnostic (badge orange).
     v5.16.13 = drawProfil(false) : contenu seul au defilement.
     v5.16.12 = cle de cache limitee aux classes de mode.
     v5.16.11 = geometrie memorisee par mode (stabilite defilement).
     v5.16.10 = #mapwrap flex-column en .alti (fix mini-alti).
     v5.16.9 = plus aucune hauteur px en 2F alti (flex:1 gouverne).
     v5.16.8 = mesure getBoundingClientRect + borne haute du SVG.
     v5.16.7 = SVG en pixels explicites, borne par le bas du conteneur.
     v5.16.6 = hauteur panneau recalculee par drawProfil a chaque trace.
     v5.16.5 = CRITIQUE : fix TDZ render()/profilOn (page vide).
     v5.16.4 = cadrage zone visible + hauteur alti en pixels.
     v5.16.3 = purge du graphe SVG a la fermeture.
     v5.16.2 = redessin differe (rAF + 150 ms) + ResizeObserver panneau.
     v5.16.1 = boutons ⇅/⧉ alti 1F en z-index 1600.
     v5.16 = (1) ouverture smartphone : mode "3 FENETRES" par defaut
     (photo+carte+alti, comme si ⛰ de la carte etait active) ;
     (2) en 3F : carte RECENTREE sur la photo affichee + marqueurs
     reduits d'1/3 (2F photo+carte inchange) ; (3) monofenetre alti :
     bouton retour ⇅ (manquant) ; (4) butee ZMAX 18->16 (anti "page
     bleue" a zoom max) ; (5) bouton 🛰 vue SATELLITE (tuiles Esri
     World Imagery) sur smartphone ET laptop.
     v5.15.12 = grille dates alti 4 lignes (ouverture 6 s, poignee 7 s).
     v5.15.10 = la DATE ALTI SUIT la date PHOTO : changer la journee
     via le menu du haut passiverise l'ancienne date auto dans l'alti
     et active la nouvelle (selection = puces cochees a la main U
     date de la photo affichee) ; les puces cochees manuellement ne
     sont JAMAIS desactivees automatiquement.
     v5.15.9 = en 2F photo+ALTI, fenetre alti 60% de hauteur.
     v5.15.8 = poignee ⌄ des dates alti : affichage 4 s (2500 ms
     avant : trop court pour cocher plusieurs dates).
     v5.15.7 = temporisations 1 s (barre du haut ET puces dates de
     l'alti, rappel poignee = 2,5 s) ; poignee ⌄ AJOUTEE dans la
     fenetre altimetrie pour selectionner les dates ; poignee de la
     barre du haut DEPLACEE vers le haut de la PHOTO (avant : carte).
     v5.15.6 = barre flottante en 2F (normal + 3 fenetres), puces
     flottantes sur l'alti, photo conservee apres fermeture ✕.
     v5.15.5 = la PHOTO RESTE AFFICHEE en mode "3 fenetres".
     v5.15.4 = barre temporaire + bouton ✕ + alti 40%.
     v5.15.3 = MODE "3 FENETRES" (2F photo+carte + ⛰ de la carte) :
     photo masquee, barre du haut flottante translucide (survol
     temporaire par-dessus la carte), carte+alti occupent tout
     l'ecran, alti agrandie a 45% -> plus de troncature en bas.
     v5.15.2 = FIX : bouton ⧉ (retour 2 fenetres) visible en alti
     plein ecran 1F - c'etait le seul ecran d'ou l'on ne pouvait
     PAS revenir en double fenetre.
     v5.15.1 = FIX MOBILE : (1) altimetrie en OVERLAY sur la carte
     (2F photo+carte + ⛰) : puces de dates masquees -> le graphe
     n'est plus tronque en bas ; (2) bouton ⛰ de la pile reduit
     (40px) sur smartphone.
     v5.15 = VUES ALTIMETRIE MOBILES (bouton ⛰ dans l'entete) :
     - 1 fenetre : ⛰ = altimetrie PLEIN ECRAN (retour photo par ⇅)
     - 2 fenetres : ⛰ = bas de panneau passe de la CARTE a l'ALTI
       (et inversement) -> combos photo+carte / photo+alti ; la vue
     carte+alti reste accessible en 1F carte (⛰ de la pile zoom =
     overlay 35% comme avant).
     v5.14.2 = FIX curseur altimetrie : l'heure des photos (nom de
     fichier, heure locale) etait lue en UTC -> decalage +2h (ete) :
     curseur trop a droite en debut de journee, invisible sur les 2
     dernieres heures. Aussi : photo hors trace (avant allumage GPS /
     apres extinction) -> curseur aux bornes de la journee la plus
     proche, au lieu de disparaitre.
     v5.14.1 = FIX altimetrie : (1) journees mises bout a bout sur un
     axe virtuel -> les nuits ne creent plus d'espaces vides entre les
     courbes (separateur pointille discret entre journees) ; (2) le
     bouton ⛰ reste visible sur smartphone (zoom +/- toujours retires).
     v5.14 = ALTIMETRIE : bouton ⛰ (stack zoom) -> panneau bas de carte
     (~35%), multi-dates par puces, axe Y dynamique, curseur vertical
     a l'heure de la photo affichee, clic inverse profil -> photo.
     Donnees : profil.json genere par build_daily/gerer (v5.2.25).
     v5.13 = PORTRAIT PANORAMABLE : miniatures portraits non recadrees
     (etape1 v5.7, 600 x H), affichees pleine largeur dans le cadre fixe
     avec defilement vertical a la petite main (enablePan).
     v5.12 = FIX chevron DEFINITIF : le fond orange est sur .selbox (la
     boite), le select devient transparent dedans - le chevron est dans
     le bouton par construction, aucun rendu natif ne peut l'exiler
     (v5.10/v5.11 calaient le ▾ sur une boite dont le select natif
     divergeait legèrement selon navigateur/zoom). -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal vélo — Galerie</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,sans-serif;background:#0b0e13;color:#eee;overflow:hidden}
  #wrap{display:flex;height:100%;width:100%;position:relative}
  /* --- partie 1 : galerie (gauche) --- */
  #side{flex:0 0 var(--side-w,340px);background:#11151d;border-right:1px solid #39445c;display:flex;flex-direction:column;min-width:0}
  #side .sh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #26304a}
  #side .sh .t{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* poignee de redimensionnement galerie <-> carte (glisse lateral) */
  #split{flex:0 0 10px;cursor:col-resize;background:#1c2230;border-left:1px solid #39445c;border-right:1px solid #39445c;touch-action:none}
  #split:hover,#split.on{background:#ff7a00}
  #media{background:#000;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden}
  #media img,#media video{max-width:100%;max-height:100%;display:block}
  /* v5.13 : photo PORTRAIT - affichee PLEINE LARGEUR dans le cadre
     fixe (hauteur libre > cadre), defilement vertical a la petite main */
  #media img.tall{max-height:none;width:100%;height:auto;position:absolute;top:0;left:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none}
  #media img.tall.drag{cursor:grabbing}
  /* v5.13.1 : indice VISUEL de glissement (le cursor grab est invisible
     sur ecran tactile) - badge main + doubles fleches, pulse, disparait
     au premier glissement (classe .off) ou apres 5 s. */
  #panHint{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:22px;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:1;pointer-events:none;animation:panPulse 1.6s ease-in-out infinite;transition:opacity .4s}
  #panHint.off{opacity:0;animation:none}
  @keyframes panPulse{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-7px);opacity:.65}}
  #cap{padding:9px 12px;font-size:13px;color:#c8d2e0;border-top:1px solid #26304a}
  #cap .nm{font-weight:600;color:#eef2f8;margin-bottom:3px;word-wrap:break-word}
  #cap .dt{opacity:.75}
  /* commentaire mis en evidence : bloc distinct, plus grand, lisible */
  #cmt{display:none;margin-top:6px;padding:8px 11px;background:#1c2740;border-left:4px solid #ff7a00;border-radius:0 8px 8px 0;font-size:15.5px;line-height:1.45;color:#ffe9c9;word-wrap:break-word}
  #cmt.on{display:block}
  #cmt{max-height:5.2em;overflow-y:auto}   /* meme sur laptop : un long commentaire ne mange pas la photo */
  /* --- partie 2 : carte (droite) --- */
  #mapwrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0;overflow:hidden;background:#a9c6d8;cursor:grab;touch-action:none}
  #map.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;width:0;height:0}
  .tile{position:absolute;width:256px;height:256px;border:none}
  #traces{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  /* v5.22.4 : le calque de la trace LIVE (id renomme "tracelive" en
     v5.22.2) n'avait PLUS ce positionnement -> SVG taille nulle,
     pointille invisible malgre des donnees valides (cas reel :
     tr:1 pts:9 mais rien sur la carte). */
  #tracelive{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  /* v5.17 : marqueur LIVE pulsant (position gpslogger du jour) */
  /* v5.24.7 : pastille live VERTE en mouvement actif (etait rouge
     #e63946 depuis v5.23.1 - retour 21/10 : "remettre la couleur du
     curseur LIVE en vert"). Inactif (> 10 min) : gris, sans pulse
     (regle .pause inchangee). */
  .mklive{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#2ecc71;border:2.5px solid #fff;animation:livepulse 2s infinite;pointer-events:none;z-index:5}
  .mklive.pause{background:#8a8f98;animation:none}
  /* v5.24.8 : ONDE DE PULSATION VERTE - l'ombre animee restait
     ORANGE rgba(255,122,0) (couleur historique du curseur) alors que
     la pastille est verte depuis la v5.24.7 (retour 21/10). */
  @keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.7)}70%{box-shadow:0 0 0 16px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  .mk{position:absolute;transform:translate(-50%,-100%);cursor:pointer;line-height:0}
  .mk .icon{display:block;transition:transform .18s ease;transform-origin:50% 100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .mk.sel .icon{transform:scale(1.65);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #fff) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .mk.sel{z-index:500}
  /* v5.24.9 : pastille HEURE du marqueur photo ACTIF (mode classique)
     - meme style que l'heure de la sonde live (noir sur blanc, v5.24.8).
     Positionnee a cote du pin par applySel(), purgee a chaque rendu. */
  .mkhour{position:absolute;z-index:550;font-size:11px;font-weight:700;color:#000;background:#fff;border-radius:6px;padding:2px 5px;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;line-height:1.4}
  /* v5.24.19 : ecran d'aide quand le double-tap n'ouvre AUCUNE photo
     (journee sans media) - remplace la photo par un ecran noir
     explicatif, texte jaune. */
  /* v5.24.19 obsolete (remplacee par .homeCard v5.24.33) */
  /* v5.24.26 : smartphone, vue 1F - boutons ALTI caches UNIQUEMENT en
  vue 1F PHOTO (:not(.showmap)) - la v5.24.22 masquait aussi le ⛰ de
  la pile zoom en vue 1F CARTE, ou il est necessaire pour basculer
  en 2F carte+alti (retour 21/10). Le bouton CARTE reste partout. */
  #wrap.single:not(.showmap) #btProfil,
  #wrap.single:not(.showmap) #hdAlti{display:none}
  #wrap.single.alti #btProfil, #wrap.single.alti #hdAlti,
  #wrap.single.showprofil #btProfil, #wrap.single.showprofil #hdAlti
    {display:flex}
  /* v5.24.32/33 : PAGE D'ACCUEIL smartphone (10 s au refresh, 1 tap =
     quitter) - v5.24.33 : borne a la FENETRE DU HAUT (galerie +
     commentaires) : carte et puces alti restent visibles dessous */
  #side{position:relative}
  #homeP{position:absolute;inset:0;z-index:1700;background:#0d1117f8;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;text-align:center;gap:10px;cursor:pointer}
  #homeP .guide,.homeCard .guide{color:#8a94b0;font-size:13.5px;
    line-height:1.75;text-align:left;max-width:340px}
  #homeP .guide b,.homeCard .guide b{color:#ffd60a;font-weight:700}
  #homeP svg{height:86px;max-width:220px}
  #homeP.frozen{outline:3px solid #ffd60a;outline-offset:-3px}   /* fige */
  /* v5.24.39 : cadre de LECTURE CONTINUE - liseré jaune discret sur
     les contours de la fenetre photo, tant que la lecture defile */
  #media.autoOn{outline:3px solid #ffd60a;outline-offset:-3px}
  /* v5.24.33 : accueil en REMPLACEMENT DE L'ECRAN NOIR (double-tap
     sans media, laptop) - meme contenu, sans timer ni centrage */
  .homeCard{display:flex;flex-direction:column;justify-content:center;
    align-items:center;height:100%;background:#0d1117;padding:10px;
    gap:8px;text-align:center}
  .homeCard svg{height:64px;max-width:180px}
  /* --- contrôles --- */
  #zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:1000}
    #zoom button{width:52px;height:52px;font-size:26px;font-weight:700;border-radius:12px;border:2px solid #b35300;background:#ff7a00;color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  #zoom button:hover{background:#ffa040}
  #zoom button:active{background:#cc6200}
  /* v5.14 : bouton altimetrie (dans la pile #zoom) + panneau profil */
  #zoom button.on{background:#1f77e5;border-color:#123c6e}
  /* v5.19.1 : menu de choix du fond de carte (bouton 🏔) */
  #vueMenu{display:none;position:absolute;left:70px;top:10px;z-index:1200;flex-direction:column;gap:6px}
  #vueMenu.open{display:flex}
  #vueMenu button{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid #45526b;background:#1c2230ee;color:#eee;font-size:14px;cursor:pointer;backdrop-filter:blur(4px);box-shadow:0 3px 8px rgba(0,0,0,.45);white-space:nowrap}
  #vueMenu button:hover{background:#2a3245}
  #vueMenu button.on{background:#1f77e5;border-color:#123c6e}
  #profil{position:absolute;left:0;right:0;bottom:0;height:35%;background:#0d1117f2;border-top:2px solid #39445c;z-index:1002;display:none;flex-direction:column}
  #profil.on{display:flex}
  #prChips{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;flex:0 0 auto;scrollbar-width:thin}
  .prChip{padding:4px 10px;border-radius:14px;background:#1c2230;border:1px solid #45526b;color:#eee;font-size:12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  /* v5.17.1 : badge km de la journee active (droite du selecteur de date) */
  #kmDay{padding:4px 10px;border-radius:14px;background:#1c2230;border:1px solid #45526b;color:#ffd60a;font-size:12px;font-weight:700;white-space:nowrap;flex:0 0 auto}
  #kmDay:empty{display:none}
  /* v5.19.3 : badge km AGRANDI sur laptop/desktop (17px = taille
     des boutons de la barre du haut + 2px) ; mobile garde 12px. */
  @media (min-width:821px){#kmDay{font-size:17px;padding:5px 12px}}
  .prChip.on{background:#ff7a00;border-color:#b35300;font-weight:700}
  #prWrap{flex:1;position:relative;margin:0 8px 8px}
  #prSvg{width:100%;height:100%;display:block}
  #bar{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:1000}
  #bar button{padding:9px 13px;border-radius:9px;border:1px solid #45526b;background:#1c2230ee;color:#eee;font-size:14px;cursor:pointer;backdrop-filter:blur(4px)}
  #bar button:hover{background:#2a3245}
  #bar button.on{background:#2d6a4f;border-color:#40916c}
  #bar a{padding:16px 24px;border-radius:12px;border:2px solid #2f6db3;background:#1b3a63ee;color:#fff;font-size:20px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(4px);box-shadow:0 3px 8px rgba(0,0,0,.45)}
  #bar a:hover{background:#255089}
  /* v5.22 : bouton MODE DIRECT (bas droite de la carte) - visible
     des que le live est valide ; clignote 6 s aux (re)demarrages
     du deplacement ; actif (vert) en mode direct. */
  #btLive{position:absolute;right:10px;bottom:10px;z-index:1100;display:none;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;border:1px solid #40916c;background:#2d6a4fee;color:#fff;font-size:14px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px);box-shadow:0 3px 8px rgba(0,0,0,.45)}
  #btLive:hover{background:#3a7f62}
  #btLive.on{background:#ff7a00;border-color:#b35300}
  /* v5.24 : clignotement PERMANENT (jusqu'au 1er clic sur le bouton) */
  #btLive.blink{animation:liveblink .7s steps(2,start) infinite}
  @keyframes liveblink{50%{opacity:.2}}
  /* v5.22 : sonde live (point tape sur la trace/courbe) + cycliste */
  #mkprobe{position:absolute;z-index:600;transform:translate(-50%,-100%);text-align:center;line-height:1}
  #mkprobe .d{width:12px;height:12px;border-radius:50%;background:#ffd60a;border:2px solid #fff;margin:0 auto;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  /* v5.24.8 : heure de la sonde NOIRE sur la carte (etait jaune
     #ffd60a, peu visible - retour 21/10). Liseret blanc pour rester
     lisible sur les zones sombres de la carte. NB : la SONDE du
     GRAPHE ALTI garde son jaune (fond noir -> parfait, inchange). */
  #mkprobe .h{font-size:11px;font-weight:700;color:#000;background:#fff;border-radius:6px;padding:2px 5px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  #cyc{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0d1117}
  #cyc svg{width:min(72%,320px);height:auto}
  #cyc .roue{transform-origin:center;transform-box:fill-box}
  #cyc .jambe{transform-origin:0 0;transform-box:fill-box}
  #cyc.mov .roue{animation:cycspin .9s linear infinite}
  #cyc.mov .jambe{animation:cycped .55s ease-in-out infinite alternate}
  #cyc.mov .jambe.j2{animation-delay:-.275s}
  @keyframes cycspin{to{transform:rotate(360deg)}}
  @keyframes cycped{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
  .nav{flex:0 0 64px;height:56px;font-size:28px;font-weight:700;background:#ff7a00;border:2px solid #b35300;color:#fff;cursor:pointer;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
  .nav:hover{background:#ffa040}
  .nav:active{background:#cc6200}
  /* menu deroulant Date : depuis v5.12, le VISUEL (orange, bordure,
     arrondi, ombre) est sur .selbox et le select est TRANSPARENT dedans.
     Le chevron est dans la boite orange PAR CONSTRUCTION : aucun rendu
     natif du select (bordures, metriques Android) ne peut l'exiler. */
  .selwrap{display:flex;flex:1 1 auto;min-width:0;justify-content:center}
  .selbox{position:relative;display:inline-flex;flex:0 0 auto;width:128px;height:56px;background:#ff7a00;border:2px solid #b35300;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
  .selbox:hover{background:#ffa040}
  select.nav{flex:1;min-width:0;height:100%;background:transparent;border:none;font-size:16px;font-weight:700;color:#fff;cursor:pointer;text-align:center;text-align-last:center;padding:0 24px 0 6px;-webkit-appearance:none;appearance:none}
  .selArrow{position:absolute;right:7px;top:50%;transform:translateY(-50%);pointer-events:none;color:#fff;font-size:15px;font-weight:700;line-height:1}
  select.nav option{background:#1c2230;color:#eee;font-weight:400}
  /* zone admin (visible uniquement en mode #adm=) : saisie commentaire */
  #admBox{padding:8px 12px;border-top:1px solid #26304a;display:none;flex-direction:column;gap:6px}
  #admBox.on{display:flex}
  /* =========== ADAPTATION SMARTPHONE ===========
     REGLE D'OR : cette section est en FIN de feuille car, a specificite
     egale, la DERNIERE regle du source gagne - placee avant les regles
     de base (#zoom, select.nav, #bar a...), elle etait systematiquement
     ecrasee (bug v5.3 : zoom visibles, boutons hdFlip masques sur S8). */
  /* bases "cachees par defaut" (laptop) : AVANT les media queries */
  #hdFlip,#hdLayout,#hdAlti{display:none}
  #btFlip{display:none}
  #btLayoutM{display:none}
  /* monofenetre (ecran tres etroit) : photo OU carte, bascule glisse/bouton */
  #wrap.single{flex-direction:column}
  #wrap.single #split{display:none}
  #wrap.single #side{--side-w:100%}
  #wrap.single:not(.showmap) #mapwrap{display:none}
  #wrap.single.showmap #side{display:none}
  #wrap.single.showmap #mapwrap{flex:1}
  #wrap.single.showmap #btFlip{display:flex;position:absolute;left:10px;bottom:14px;z-index:1001;width:46px;height:46px;border-radius:12px;border:2px solid #b35300;background:#ff7a00cc;color:#fff;font-size:22px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
  /* v5.16 : meme bouton retour ⇅ en MONOFENETRE ALTIMETRIE (il manquait
     - seul ecran sans retour vers la photo) */
  #wrap.single.showprofil #btFlip{display:flex;position:absolute;left:10px;bottom:14px;z-index:1001;width:46px;height:46px;border-radius:12px;border:2px solid #b35300;background:#ff7a00cc;color:#fff;font-size:22px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
  #wrap.single.showmap #btFlip:hover{background:#ffa040}
  /* v5.15 : ALTI PLEIN ECRAN en 1F (bouton ⛰ de l'entete photo) -
     le panneau #profil (dans #mapwrap) remplace TOUT : map masquee */
  #wrap.single.showprofil #side{display:none}
  #wrap.single.showprofil #mapwrap{display:block;flex:1}
  #wrap.single.showprofil #map{display:none}
  #wrap.single.showprofil #zoom,#wrap.single.showprofil #bar{display:none}
  /* v5.15.2 : le bouton ⧉ (retour 2 fenetres) doit rester VISIBLE en

  #wrap.single.showprofil #btLayoutM{display:flex;z-index:1600}   /* v5.16.1 : AU-DESSUS du panneau #profil (z-index 1002) */
  #wrap.single.showprofil #profil{display:flex;position:relative;height:100%;border-top:none}
  #wrap.single.showprofil #btFlip{display:flex;position:absolute;left:10px;bottom:14px;z-index:1600;width:46px;height:46px;border-radius:12px;border:2px solid #b35300;background:#ff7a00cc;color:#fff;font-size:22px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
  #wrap.single.showprofil #btFlip:hover{background:#ffa040}
  /* v5.15 : en 2F, bas de panneau = ALTIMETRIE (carte masquee, profil

  #wrap.alti #map{display:none}
  #wrap.alti #zoom,#wrap.alti #bar,#wrap.alti #btLayoutM{display:none}
  #wrap.alti #mapwrap{display:flex;flex-direction:column}   /* v5.16.10 : contexte flex - sans lui, flex:1 du panneau etait INERTE (parent en bloc) et height:auto le reduisait a la hauteur de son contenu (mini-alti en haut, reste noir) */
  #wrap.alti #profil{display:flex;position:relative;height:auto;flex:1;border-top:none}
  /* v5.16.6 : la hauteur REELLE du panneau alti est fixee en px par
     drawProfil a chaque trace ; height:auto ci-dessus n'est qu'un
     état propre avant le premier trace (drawProfil ecrase via style) */
  /* empilement portrait : galerie au-dessus (55%), carte dessous */
  @media (orientation: portrait) and (max-width:820px){
    #wrap{flex-direction:column}
    #side{--side-w:55%}
    /* v5.15.9 : en 2F PHOTO+ALTI (.alti), le bas d'ecran etant inutilise
       (pas de carte), la fenetre alti gagne ~1/3 de hauteur : la part du
       bas passe de 45% a 60% au lieu des 45% de la carte */
    #wrap.alti #side{--side-w:40%}
    #split{flex:0 0 10px;cursor:row-resize;border-left:none;border-right:none;border-top:1px solid #39445c;border-bottom:1px solid #39445c}
  }
  @media (max-width:820px){
    /* gestes > boutons : fleches et zoom retires sur smartphone */
    #prev,#next{display:none}
    /* v5.14.1 : le bouton altimetrie ⛰ reste accessible sur smartphone
       (les zoom +/- restent retires : gestes tactiles) */
    #zoom{display:flex}
    #zoom #zin,#zoom #zout{display:none}
    /* v5.15.1 : bouton ⛰ de la pile plus discret sur smartphone, et
       puces de DATES masquees quand l'altimetrie est en OVERLAY sur la
       carte (2F photo+carte + ⛰) : le panneau ~35% etant petit, les
       puces tronquaient le bas du graphe. La puce par defaut reste la
       date du media affiche ; les autres dates restent accessibles via
       les vues alti pleine hauteur (2F .alti ou 1F plein ecran). */
    #zoom #btProfil,#zoom #btSat,#zoom #btTopo{width:40px;height:40px;font-size:19px}
    /* v5.19.2 : en 3F smartphone, la pile de gauche est REDUITE
       (32px au lieu de 40) : la carte y est la plus petite vue et
       ⛰/🛰/🏔 empietaient sur l'alti. Le menu des fonds suit (bouton
       plus petit + decalage gauche plus court). */
    #wrap.p3 #zoom button{width:32px;height:32px;font-size:15px}
    #wrap.p3 #zoom #btProfil,#wrap.p3 #zoom #btSat,#wrap.p3 #zoom #btTopo{width:32px;height:32px;font-size:15px}
    #wrap.p3 #vueMenu{left:48px}
    #wrap.p3 #vueMenu button{padding:7px 10px;font-size:12px}
    #wrap:not(.alti):not(.showprofil) #profil.on #prChips{padding-top:6px}
    /* v5.15.3 : cas "3 fenetres" (2F photo+carte + ⛰ overlay) : photo
       masquee, barre du haut FLOTTANTE translucide par-dessus la carte,
       carte+alti occupent tout l'ecran -> l'altimetrie (45%) n'est plus
       tronquee. Retour a la normale en refermant l'alti. */
    #shHandle{display:none}
    /* v5.15.6 : en 2 FENETRES (mode normal OU "3 fenetres" p3), la
       barre du haut est TOUJOURS flottante et temporaire (0,5 s par
       defaut) par-dessus la photo : le media monte d'autant, la

    #wrap:not(.single) #side .sh{position:absolute;top:0;left:0;right:0;z-index:1500;background:#11151dcc;backdrop-filter:blur(4px);border-bottom:1px solid #39445c;opacity:0;pointer-events:none;transition:opacity .3s}
    /* v5.16.24 (demande utilisateur) : en 2F photo+alti, la barre du
       haut est TOUJOURS VISIBLE et reprend sa place dans le FLUX
       (statique) : la fenetre photo est DECALEE dessous - la marge
       gagnee par l'alti reduite d'un tiers le permet. */
    #wrap.alti #side .sh{position:static;opacity:1;pointer-events:auto;background:#11151d;border-bottom:1px solid #39445c}
    #wrap:not(.single) #side .sh.show{opacity:1;pointer-events:auto}
    /* v5.15.7 : poignee ⌄ des DATES de l'alti - meme principe que
       celle de la barre du haut (visible quand les puces sont
       cachees, rappel 2,5 s par clic) */
    #prHandle{display:none}
    #profil.on:not(.chipsbar) #prHandle{display:flex}
    /* v5.15.7 : poignee ⌄ de la barre du haut, positionnee au-dessus
       de la PHOTO (avant : haut de la carte) - c'est la que l'oeil
       cherche la navigation */
    #side{position:relative}
    #wrap:not(.single):not(.baron) #shHandle{display:flex}
    /* v5.16.25 : en 2F photo+alti, la barre du haut est FIXE -> la
       poignee orange ⌄ est INUTILE (elle reaparaissait ~1 s apres
       chaque changement de photo, quand le flash "baron" expire) */
    #wrap.alti #shHandle{display:none !important}
    /* v5.15.6 : puces de DATES de l'alti = aussi FLOTTANTES (par-dessus
       le haut du graphe, 0,5 s a chaque changement de photo) - le
       graphe garde toute sa hauteur, plus de troncature */
    /* v5.15.12 : puces en GRILLE 4 LIGNES x colonnes de 4 dates
       (glissement horizontal = colonnes suivantes) */
    #profil.on #prChips{position:absolute;top:0;left:0;right:0;z-index:5;background:#0d1117f2;opacity:0;pointer-events:none;transition:opacity .25s;display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);grid-auto-columns:max-content;align-content:start;gap:4px;padding:8px;overflow-x:auto;max-height:148px}
    #profil.on #prChips.show{opacity:1;pointer-events:auto}
    /* bouton FERMER l'alti (en haut a droite de l'alti) */
    #prClose{display:none}
    #wrap.p3 #prClose{display:flex;position:absolute;top:6px;right:8px;z-index:1600;width:36px;height:36px;border-radius:10px;border:2px solid #b35300;background:#ff7a00;color:#fff;font-size:17px;font-weight:700;align-items:center;justify-content:center;cursor:pointer}
    #wrap.p3 #profil{height:40%}
    /* v5.18.1 : marqueurs REDUITS sur smartphone en 2F et 1F (pin 22px
       -> ~16px visuel) : plus discrets sur petit ecran, la carte
       reste lisible quand les photos sont proches. Le marqueur
       SELECTIONNE reste agrandi mais reste < au desktop. Le mode
       3F garde ses tailles dediees ci-dessous (.67 / 1.1, plus
       specifiques : elles gagnent). */
    .mk .icon{transform:scale(.75)}
    .mk.sel .icon{transform:scale(1.25)}
    /* v5.16 : en mode "3 fenetres" uniquement, marqueurs encore plus
       reduits (la carte y est la plus petite des vues). Ces regles
       plus specifiques gagnent sur celles du 2F/1F ci-dessus. */
    #wrap.p3 .mk .icon{transform:scale(.67)}
    #wrap.p3 .mk.sel .icon{transform:scale(1.1)}
    /* v5.22.1 : MODE DIRECT mobile = vraie 2F CARTE+ALTI : la fenetre
       photo est masquee (le cycliste y est visible seulement depuis
       la vue classique, tap 📡 pour y revenir) et l'alti gagne la
       place (45%). */
    #wrap.p3.direct #side{display:none}
    #wrap.p3.direct #profil{height:45%}
    /* styles communs des poignees ⌄ (barre du haut, puces alti) */
    #shHandle,#prHandle{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:1501;height:26px;padding:0 14px;border-radius:0 0 10px 10px;border:1px solid #b35300;border-top:none;background:#ff7a00cc;color:#fff;font-size:14px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
    /* l'URL/nom de fichier n'apporte rien sur mobile : date deja dans
       le menu, le commentaire reste (bloc #cmt) */
    #cap .nm,#cap .dt{display:none}
    .selbox{width:124px;height:40px}
    select.nav{font-size:12.5px;padding-right:22px}
    .selArrow{right:6px;font-size:13px}
    #bar a{padding:7px 9px;font-size:12px;border-width:1px;box-shadow:0 2px 5px rgba(0,0,0,.4)}
    #cap{font-size:12px}
    #cmt{font-size:13.5px;max-height:3.4em}
    #admBox button{height:38px;font-size:14px}
    /* boutons d'entete photo (mobile seulement) : bascule carte + layout */
    #hdFlip,#hdLayout{display:flex;flex:0 0 40px;height:40px;font-size:17px;align-items:center;justify-content:center}
    /* v5.15 : bouton ALTIMETRIE dans l'entete - present en 1F (photo ->
       alti plein ecran) ET en 2F (bas de panneau carte -> alti) */
    #hdAlti{display:flex;flex:0 0 40px;height:40px;font-size:17px;align-items:center;justify-content:center;background:#1c2230}
    #hdAlti.on{background:#1f77e5}
    /* v5.13.2 : en mode 2 FENETRES (non .single), le bouton carte (hdFlip)
       est INUTILE - showmap n'agit qu'en monofenetre (bug constate : il
       ne faisait RIEN en 2 fenetres) : on le MASQUE. Il revient en
       monofenetre, ou il bascule galerie -> carte. */
    #wrap:not(.single) #hdFlip{display:none}
    /* v5.13.3 : idem pour le bouton layout de la carte (btLayoutM) :
       en 2 FENETRES il duplique le hdLayout de l'entete (toujours
       visible) -> masque. En MONOFENETRE carte (.single.showmap),
       l'entete est masque : btLayoutM reste le SEUL moyen de
       revenir a la vue 2 fenetres -> affiche. */
    #wrap:not(.single) #btLayoutM{display:none}
    /* bouton layout 2-fenetres, sur la carte (mobile seulement) */
    #btLayoutM{display:flex;position:absolute;left:64px;bottom:14px;z-index:1001;width:46px;height:46px;border-radius:12px;border:2px solid #b35300;background:#ff7a00cc;color:#fff;font-size:18px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
    #btLayoutM:hover{background:#ffa040}
  }
  #admBox textarea{background:#0d1117;color:#eee;border:1px solid #45526b;border-radius:8px;padding:8px;font-family:inherit;font-size:13px;resize:vertical;min-height:44px}
  #admBox button{align-self:flex-end;height:42px;font-size:16px}
  #cnt{font-size:12px;opacity:.7;padding:0 4px;margin-left:auto}   /* margin auto : pousse le compteur et '>' vers le bord droit */
  #err{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#5c1a1a;border:1px solid #a33;color:#fff;padding:10px 16px;border-radius:10px;z-index:2000;display:none;font-size:14px}

<body>
<div id="wrap">

    <div id="vueMenu">

    </div>
    <button id="btLive" title="Mode direct : alti live + cycliste">📡 Direct</button>
  </div>

<div id="err"></div>
<script>
"use strict";
// --- v5.24.3 : BASE RELATIF "." (retour portail 21/10). Avant : URL
// absolue github.io -> les donnees (photos.csv, geojson, live, profil)
// chargees DIRECTEMENT depuis GitHub, contournant tout portail/proxy
// (fenetres de dates inoperantes) ET revelant l'URL GitHub dans le
// source. Relatif "." : sur github.io, resolu en meme-origine (comportement
// inchange) ; via un portail/proxy, resolu vers le portail -> filtrage
// effectif. NE PAS remettre d'URL absolue.
const BASE = ".";
// --- 2 lignes a adapter (mode admin) : l'identite du depot GitHub.
// v5.24.15 : REPO ne vit PLUS dans le source - il passe par le FRAGMENT
// d'URL, comme le token (#adm=<token>&repo=<owner>/<repo>). Le
// fragment n'est JAMAIS envoye au serveur (pas dans les logs GitHub
// ni du portail) ni ecrit dans le source (Ctrl+U) : l'ami qui passe
// par le portail ne voit aucune identite. L'admin ouvre la galerie
// avec son URL-complete en signet (bookmark) ; sans ce signet, le
// mode admin est simplement absent.
const H = new URLSearchParams(location.hash.slice(1));
const REPO = H.get("repo") || null;
// --- v5.18 : liens amis temporaires (déploiement VITRINE) ---
// Un code par ami + date d'expiration ISO. Le lien ami :
//   https://<user>.github.io/<vitrine>/?ami=<code>
// - code absent ou inconnu -> accès NORMAL (lien famille permanent ;
//   aussi le cas du dépôt données, qui ne doit RIEN bloquer).
// - code valide -> accès jusqu'à sa date (23:59:59).
// - code expiré -> la page est remplacee par "lien expire".
// Revoquer avant terme : retirer la ligne + push vitrine (~1 min).
// NB honnete : la table est lisible dans le source ; la protection
// REELLE reste la rotation du dépôt données (MOP partie 7 §4).
const AMIS = {
  // "exemple": "2026-12-31",   // <- 1 ligne par ami, code arbitraire
};
if (location.search.includes("ami=")) {
  const q = new URLSearchParams(location.search).get("ami");
  const exp = q && AMIS[q];
  if (exp && new Date() > new Date(exp + "T23:59:59")) {
    document.body.innerHTML =
      "<p style='padding:40px;font-size:20px;font-family:sans-serif'>" +
      "Lien expiré — demandez un lien à jour à Alain.</p>";
    throw new Error("expired");
  }
}

const mapEl = document.getElementById("map");
const world = document.getElementById("world");
const side = document.getElementById("side");
const mediaEl = document.getElementById("media");
const capTxt = document.getElementById("capTxt");
const capDate = document.getElementById("capDate");
const cntEl = document.getElementById("cnt");
const errEl = document.getElementById("err");

let zoom = 11, clon = -1.85, clat = 48.15;   // centre initial (cadrage auto ensuite)
let ox = 0, oy = 0;
// v5.24.27 : hauteur du panneau alti PARTAGEE (etait locale a render)
// - le zoom molette en a besoin pour respecter la meme convention de
// centrage vertical : sans elle, chaque coup de molette (alti ouverte)
// declenchait un glissement de profH/2 px vers le sud (retour 21/10).
let profH = 0;
let media = [], marks = [], traces = [];
let mkHourEl = null;   // v5.24.9 : pastille heure du marqueur actif
let classicProbe = null; // v5.24.17 : sonde classique {t(s), lon, lat} - v5.24.17
// v5.17 : live (position gpslogger du jour, poussee par live.py)
let live = null, liveTrace = [], liveEl = null, liveSeen = false;   // v5.24 : liveSeen = 1er clic sur le bouton Direct
// v5.17.1 : km par journee (profil.json "km", charge au boot)
let kmData = null, srcData = null, barLastDate = null;   // v5.24 : src = fiabilite alti (garmin/gpslogger), barLastDate = tempo 8 s
let sel = -1, userResized = false;   // userResized : l'utilisateur a glisse la poignee -> plus d'ajustement auto
const ZMIN = 3, ZMAX = 16;   // v5.16 : ZMAX 18->16, butee anti "page
                             // bleue" (au-dela de 16, tuiles vides/ocean)
// ---------- contexte d'affichage : laptop OU smartphone ----------
// "pointer:coarse" = doigt (pas souris) ; petit ecran en plus = mobile.
// Sert a desactiver l'ajustement auto de largeur (sans objet en portrait)
// et a afficher l'aide gestuelle. La bascule horizontal/vertical est
// geree par les media queries CSS (layout) + le resize (rendu carte).
const MOBILE = matchMedia("(pointer: coarse)").matches || innerWidth < 820;
// galerie <= 2/3 de l'axe disponible (largeur en paysage, hauteur en portrait)
function SIDEMAX() {
  const col = getComputedStyle(document.getElementById("wrap"))
    .flexDirection.includes("column");
  return Math.floor((col ? innerHeight : innerWidth) * 2 / 3);
}
function setSideW(px) {
  // Largeur MINIMALE de la fenetre photos : l'en-tete doit toujours tenir
  // (‹ 64 + date 128 + compteur ~50 + › 64 + marges ~30 ≈ 340 px). Sans
  // ce plancher, une video basse resolution en portrait (ex. celle du
  // 28/09) reduisait la fenetre sous cette valeur -> bouton date ampute.
  const SIDEMIN = 348;
  side.style.setProperty("--side-w", Math.max(SIDEMIN, Math.min(SIDEMAX(), px)) + "px");
}

// ---------- projection ----------
const scale = z => 256 * Math.pow(2, z);
const lon2x = (lon, z) => (lon + 180) / 360 * scale(z);
const lat2y = (lat, z) => {
  const s = Math.sin(lat * Math.PI / 180);
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * scale(z);
};
function px2lon(px) { return px / scale(zoom) * 360 - 180; }
function py2lat(py) {
  const n = Math.PI - 2 * Math.PI * py / scale(zoom);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

// ---------- tuiles ----------
const tiles = new Map();
// v5.19 : mode de fond de carte - "plan" (OSM), "sat" (Esri) ou
// "topo" (OpenTopoMap : ombrage du terrain, courbes de niveau,
// altitudes - la vue "relief 3D"). Un seul mode actif a la fois.
let vue = "plan";
// v5.19.1 : fonds disponibles. OpenTopoMap et CyclOSM sont servis
// sur 3 sous-domaines (a/b/c) - rotation pour repartir la charge,
// meme pratique que les tuiliers OSM. Tous en z/x/y standard.
const VUES = {
  plan:  { nom: "Plan",    url: k => "https://tile.openstreetmap.org/" + k + ".png" },
  topo:  { nom: "Relief",  sub: ["a", "b", "c"],
           url: (k, s) => "https://" + s + ".tile.opentopomap.org/" + k + ".png" },
  cyclo: { nom: "Vélo",    sub: ["a", "b", "c"],
           url: (k, s) => "https://" + s + ".tile-cyclosm.openstreetmap.fr/cyclosm/" + k + ".png" },
  // v5.21 : IGN - plan IGN v2 (Géoportail, libre d'acces, sans cle).
  // WMTS : ordre par parametres (z=TILEMATRIX, x=TILECOL, y=TILEROW),
  // pas par chemin comme OSM. Zoom max 19.
  ign:   { nom: "IGN",     url: k => {
            const p = k.split("/");
            return "https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0"
                 + "&REQUEST=GetTile&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2"
                 + "&STYLE=normal&FORMAT=image%2Fpng&TILEMATRIXSET=PM"
                 + "&TILEMATRIX=" + p[0] + "&TILEROW=" + p[2] + "&TILECOL=" + p[1];
          } },
};
function setVue(v) {
  vue = v;
  document.getElementById("btSat").classList.toggle("on", vue === "sat");
  document.getElementById("btTopo").classList.toggle("on", vue !== "plan" && vue !== "sat");
  document.querySelectorAll("#vueMenu button").forEach(b =>
    b.classList.toggle("on", b.dataset.vue === vue));
  document.getElementById("vueMenu").classList.remove("open");
  tiles.forEach(img => img.remove());   // vider le cache : autres tuiles
  tiles.clear();
  render();
}
function renderTiles() {
  const W = mapEl.clientWidth, H = mapEl.clientHeight;
  const x0 = Math.floor(ox / 256), y0 = Math.floor(oy / 256);
  const x1 = Math.floor((ox + W) / 256), y1 = Math.floor((oy + H) / 256);
  const max = scale(zoom) / 256;
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    if (y < 0 || y >= max) continue;
    const wx = ((x % max) + max) % max;
    const key = zoom + "/" + wx + "/" + y;
    if (tiles.has(key)) continue;
    const img = document.createElement("img");
    img.className = "tile";
    // v5.19.1 : fond selon VUES (plan OSM / relief OpenTopoMap / vélo
    // CyclOSM, via le menu 🏔) ou satellite Esri (bouton 🛰, a part).
    // Esri : /tile/{z}/{y}/{x} (y AVANT x, contrairement a OSM).
    if (vue === "sat") {
      const p = key.split("/");
      img.src = "https://server.arcgisonline.com/ArcGIS/rest/services/"
              + "World_Imagery/MapServer/tile/" + p[0] + "/" + p[2] + "/" + p[1];
    } else {
      const V = VUES[vue] || VUES.plan;
      // sous-domaine a/b/c reparti par tuile (equilibre de charge)
      img.src = V.sub ? V.url(key, V.sub[(x + y) % 3])
                      : V.url(key);
    }
    img.style.left = (x * 256) + "px";
    img.style.top = (y * 256) + "px";
    img.draggable = false;
    world.appendChild(img);
    tiles.set(key, img);
  }
}

// ---------- traces ----------
let svg = null;
function renderTraces() {
  if (svg) { svg.remove(); svg = null; }
  if (!traces.length) return;
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.id = "traces";
  // v5.23 : PRECISION SVG - les coordonnees etaient en pixels MONDE
  // absolus (~8 M px au zoom 16) : les rasteriseurs perdent la
  // precision a ces echelles et le tracé S'EFFACE au fort zoom
  // (bug reel : "tous les tracés disparaissent proche du zoom max").
  // Parade (facon Leaflet) : coordonnees RELATIVES a la fenetre
  // visible (quelques milliers de px), SVG positionne a (ox,oy) et
  // dimensionne a la fenetre.
  svg.style.left = ox + "px"; svg.style.top = oy + "px";
  svg.style.width = mapEl.clientWidth + "px";
  svg.style.height = mapEl.clientHeight + "px";
  for (const t of traces) {
    if (t.geometry.coordinates.length < 2) continue;
    const pts = t.geometry.coordinates
      .map(c => (lon2x(c[0], zoom) - ox) + "," + (lat2y(c[1], zoom) - oy))
      .join(" ");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    p.setAttribute("points", pts);
    const o = t.properties._umap_options || {};
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", o.color || "#3388ff");
    p.setAttribute("stroke-width", o.weight || 4);
    p.setAttribute("stroke-opacity", o.opacity || 0.8);
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    svg.appendChild(p);
  }
  world.appendChild(svg);
}

// ---------- v5.17.1 : badge km de la journee active ----------
function havKm(coords) {
  let d = 0;
  for (let i = 1; i < coords.length; i++) {
    const dlat = (coords[i][1] - coords[i - 1][1]) * 0.0174533;
    const dlon = (coords[i][0] - coords[i - 1][0]) * 0.0174533;
    const mlat = (coords[i][1] + coords[i - 1][1]) / 2 * 0.0174533;
    d += 6371 * Math.sqrt(dlat * dlat + Math.pow(dlon * Math.cos(mlat), 2));
  }
  return d;
}
function updateKmDay() {
  const el = document.getElementById("kmDay");
  if (!el) return;
  // v5.23 : MODE DIRECT -> km LIVE approximatif (trace live, points
  // a 1/min : la vraie distance est celle du soir, Garmin) ; le ">"
  // signale l'approximation.
  if (liveMode) {
    let t = 0;
    for (const f of liveTrace) t += havKm(f.geometry.coordinates || []);
    el.textContent = t > 0
      ? "> " + String(t < 10 ? t.toFixed(1) : Math.round(t)).replace(".", ",") + " km"
      : "";
    return;
  }
  const d = media[sel] ? media[sel].date : null;
  if (!d) { el.textContent = ""; return; }
  // 1) profil.json "km" (points NON decimes - garmin 1/s : precis)
  let km = (kmData && kmData[d] != null) ? kmData[d] : null;
  // 2) secours : trace.geojson datee (points decimes - anciens profil)
  if (km == null) {
    let t = 0;
    for (const f of traces)
      if ((f.properties || {}).date === d) t += havKm(f.geometry.coordinates || []);
    if (t > 0) km = t;
  }
  // 3) journee live pas encore publiee : distance de la trace live
  if (km == null && live && live.date === d && liveTrace.length) {
    let t = 0;
    for (const f of liveTrace) t += havKm(f.geometry.coordinates || []);
    km = t;
  }
  el.textContent = km == null ? "" :
    String(km < 10 ? km.toFixed(1) : Math.round(km)).replace(".", ",") + " km";
}

function liveValid() {

  if (!live) return false;

  return (Date.now() / 1000 - live.t) < 1800;

async function pollLive() {
  try {
    const j = await (await fetch(BASE + "/live.json?v=" + Date.now())).json();
    const changed = !live || j.t !== live.t || (j.n || 0) !== (live.n || 0);
    live = j;
    // v5.22.3 : la trace est (re)chargee si live.json change OU si on
    // n'en a PAS ENCORE une (le chargement unique d'avant restait
    // vide a vie des qu'un fetch echouait une fois - curseur OK mais
    // pointille/alti morts : cas reel diagnostique en console,
    // liveTrace.length=0 avec live.json sain).
    if (changed || !liveTrace.length) {
      try {
        const g = await (await fetch(BASE + "/live_trace.geojson?v=" + Date.now())).json();
        liveTrace = g.features || [];
        // v5.22.2 : ne plus avaler les anomalies silencieusement.
        if (!g.features) console.warn("live_trace.geojson: pas de features", g);
      } catch (e) { liveTrace = [];
        console.warn("live_trace.geojson: echec chargement", e); }
      parseLivePts();                   // v5.22 : mode direct
      render();
      if (liveMode) {
        // v5.22.1 : SUIVI - chaque nouveau point recentre la carte sur
        // la position live (le pan manuel est repris au signal suivant,
        // <= 2 min : c'est le but du suivi en direct).
        if (liveMoving()) { clon = live.lon; clat = live.lat; render(); }
        drawProfil(); showCyclist(); renderLiveProbe();
      }
    } else { renderLive(); }
    updLiveBtn();                       // v5.22 : bouton/clignotement/exit auto
  } catch (e) { /* live.json absent (feature OFF ou purge du toggle) :
      v5.24.2 : REMETTRE A ZERO - avant, la derniere position restait
      en memoire et liveValid() restait vrai jusqu'a 30 min : le
      bouton Direct ne disparaissait qu'au refresh manuel. Desormais
      le bouton disparaît au poll suivant (<= 30 s). */
    if (live) {
      live = null; liveTrace = []; parseLivePts(); render();
    }
    updLiveBtn(); }
}

let liveMode = false, livePts = [], liveProbe = null, probeEl = null;
function liveMoving() { return liveValid() && (Date.now() / 1000 - live.t) < 600; }
function fmtH(t) {                      // epoch s -> "HH:MM"
  const d = new Date(t * 1000);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function parseLivePts() {              // v1.1 de live.py : 3D + times
  livePts = [];
  for (const f of liveTrace) {
    const cs = f.geometry.coordinates || [], ts = (f.properties || {}).times || [];
    for (let i = 0; i < cs.length; i++)
      livePts.push({ lon: cs[i][0], lat: cs[i][1],
                     ele: cs[i][2] != null ? cs[i][2] : null,
                     t: ts[i] || live.t });
  }
  livePts.sort((a, b) => a.t - b.t);
}

// v5.24.19 : DOUBLE-TAP sur le graphe alti (mode classique) :
// - photo a moins de 90 min de l'heure cliquee -> l'OUVRIR et
//   RECENTER la carte sur son marqueur ;
// - sinon (journee sans media) -> RECENTER la carte sur le point
//   jaune (sonde) et afficher l'ecran d'aide noir/jaune.
function graphDoubleTap(x) {
  if (!prMap || !prMap.blocks.length) return;
  const u = (x - 42) / (prMap.W - 54) * prMap.Vtot;
  let blk = null;
  for (const b of prMap.blocks)
    if (u >= b.off && u <= b.off + b.dur) { blk = b; break; }
  if (!blk) return;
  const t = (blk.t0 + Math.max(0, Math.min(u - blk.off, blk.dur))) / 1000;
  let bi = -1, bd = Infinity;
  for (let i = 0; i < media.length; i++) {
    const pt = photoEpoch(media[i]);
    if (pt === null) continue;
    const d = Math.abs(pt / 1000 - t);
    if (d < bd) { bd = d; bi = i; }
  }
  if (bi >= 0 && bd < 90 * 60) {           // photo la plus proche
    classicProbe = null; renderClassicProbe();
    openGal(bi);
    centerActive();                        // recentrage carte sur la photo
  } else {                                 // aucune photo : sonde + aide
    if (classicProbe) {
      clon = classicProbe.lon; clat = classicProbe.lat;
      render();                            // recentrage sur le point jaune
    }
    showHomeCard();
  }
}
// v5.24.17 : x pixel du graphe -> {t(s), lon, lat} via les times des
// traces (point le plus proche en TEMPS sur TOUTES les journees).
function probeFromGraphClassic(x) {
  if (!prMap || !prMap.blocks.length) return;
  const u = (x - 42) / (prMap.W - 54) * prMap.Vtot;
  let blk = null;
  for (const b of prMap.blocks)
    if (u >= b.off && u <= b.off + b.dur) { blk = b; break; }
  if (!blk) blk = prMap.blocks[u < prMap.blocks[0].off
                              ? 0 : prMap.blocks.length - 1];
  const t = (blk.t0 + Math.max(0, Math.min(u - blk.off, blk.dur))) / 1000;
  let best = null, bd = Infinity;
  for (const tr of traces) {
    const ts = tr.times; if (!ts) continue;
    const cs = tr.geometry.coordinates;
    for (let i = 0; i < ts.length && i < cs.length; i++) {
      const d = Math.abs(ts[i] - t);
      if (d < bd) { bd = d; best = { t: ts[i], lon: cs[i][0], lat: cs[i][1] }; }
    }
  }
  if (best) {
    classicProbe = best;
    // v5.24.30 (retour 21/10) : le tap COURBE CENTRE la carte sur la
    // sonde - cas : journee sans media (ecran noir d'aide), la photo
    // restee affichee en galerie appartient a une AUTRE journee : la
    // sonde etait posee mais hors champ, invisible sans deplacement
    // manuel. render() recentre ET redessine le point jaune.
    clon = best.lon; clat = best.lat;
    drawProfil(false);
    render();
  }
}

  let best = null, bd = Infinity;
  for (const tr of traces) {
    const ts = tr.times; if (!ts) continue;
    const cs = tr.geometry.coordinates;
    for (let i = 0; i < cs.length && i < ts.length; i++) {
      const d = Math.hypot(lon2x(cs[i][0], zoom) - mx,
                           lat2y(cs[i][1], zoom) - my);
      if (d < bd) { bd = d; best = { t: ts[i], lon: cs[i][0], lat: cs[i][1] }; }
    }
  }
  if (best == null || bd >= 24) return false;
  // photo la plus proche en TEMPS du point tape (regle historique :
  // ouverte seulement si a moins de 90 min du trace)
  let bi = -1, bdt = Infinity;
  for (let i = 0; i < media.length; i++) {
    const pt = photoEpoch(media[i]);
    if (pt === null) continue;
    const d = Math.abs(pt / 1000 - best.t);
    if (d < bdt) { bdt = d; bi = i; }
  }
  if (bi >= 0 && bdt < 90 * 60) {
    classicProbe = null; renderClassicProbe();
    openGal(bi);
    centerActive();                  // v5.24.19 : recentrage sur la photo
  } else {
    // v5.24.19 : aucune photo -> recentrer sur le point tape + aide
    clon = best.lon; clat = best.lat;
    render();
    showHomeCard();
  }

}
function classicProbeFromMap(e) {
  if (!profilOn || !traces.length || Date.now() - lastDrag < 400) return;

  const now = Date.now();
  const rect0 = mapEl.getBoundingClientRect();
  const x0 = e.clientX - rect0.left, y0 = e.clientY - rect0.top;
  if (now - lastMapTapT < 350
      && Math.hypot(x0 - lastMapTapX, y0 - lastMapTapY) < 30) {

  }
  lastMapTapT = now; lastMapTapX = x0; lastMapTapY = y0;
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left + ox;
  const my = e.clientY - rect.top + oy;
  let best = null, bd = Infinity;
  for (const tr of traces) {
    const ts = tr.times; if (!ts) continue;
    const cs = tr.geometry.coordinates;
    for (let i = 0; i < cs.length && i < ts.length; i++) {
      const d = Math.hypot(lon2x(cs[i][0], zoom) - mx,
                           lat2y(cs[i][1], zoom) - my);
      if (d < bd) { bd = d; best = { t: ts[i], lon: cs[i][0], lat: cs[i][1] }; }

mapEl.addEventListener("click", e => {  // tap sur la trace live (carte)

// ---------- rendu ----------
function render() {
  // v5.16.4 : quand le panneau alti RECOUVRE le bas de la carte (3F,
  // 1F carte+alti, ou overlay laptop), centrer dans la zone VISIBLE
  // au-dessus du panneau - sinon le pointeur actif est centre dans le
  // conteneur ENTIER et parait decale vers le bas ("comme en 2F").
  // v5.24.27 : plus de declaration locale - profH est desormais la
  // VARIABLE GLOBALE (partagee avec le zoom molette) ; profH = 0 ici
  // reinitialise a chaque rendu.
  profH = 0;
  // v5.16.5 : test DOM (pas la variable profilOn, declaree PLUS BAS
  // dans le script : render() est appele AVANT sa declaration a
  // l'initialisation -> ReferenceError TDZ qui tuait TOUTE la page :
  // ni photos ni tuiles, seuls les boutons restaient)
  const panP = document.getElementById("profil");
  if (panP && panP.classList.contains("on")
      && !wrapEl.classList.contains("alti")
      && !wrapEl.classList.contains("showprofil"))
    profH = panP.offsetHeight || 0;
  ox = lon2x(clon, zoom) - mapEl.clientWidth / 2;
  oy = lat2y(clat, zoom) - (mapEl.clientHeight - profH) / 2;
  world.style.transform = "translate(" + (-ox) + "px," + (-oy) + "px)";
  renderTiles(); renderTraces(); renderMarkers(); renderLive(); renderLiveProbe(); renderClassicProbe(); updateKmDay();
  // v5.17 : trace LIVE du jour en pointilles gris, SOUS les cumuls
  if (liveValid() && liveTrace.length) {
    // v5.22.2 : id DEDIE + purge de l'ancien calque - chaque render()
    // ajoutait un nouveau SVG sans retirer le precedent (id duplique,
    // empilement a chaque poll 30 s : fuite + rendu de plus en plus
    // lourd au fil d'une journee de live).
    const old = document.getElementById("tracelive");
    if (old) old.remove();
    const sg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    sg.id = "tracelive";
    // v5.23 : coordonnees RELATIVES a la fenetre visible (precision
    // SVG au fort zoom, voir renderTraces)
    sg.style.left = ox + "px"; sg.style.top = oy + "px";
    sg.style.width = mapEl.clientWidth + "px";
    sg.style.height = mapEl.clientHeight + "px";
    for (const t of liveTrace) {
      if ((t.geometry.coordinates || []).length < 2) continue;
      const p = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      p.setAttribute("points", t.geometry.coordinates
        .map(c => (lon2x(c[0], zoom) - ox) + "," + (lat2y(c[1], zoom) - oy)).join(" "));
      p.setAttribute("fill", "none");
      // v5.24.6 : POINTILLE ALTERNE rouge-vide-vert-vide (retour 21/10 :
      // le rouge integral etait peu lisible / trop agressif). Un seul
      // polyline ne peut porter deux couleurs : on superpose 2 traces
      // de MEME dasharray sur une periode 2(d+g) - le vert, decalle de
      // d+g (stroke-dashoffset), tombe exactement dans les vides du
      // rouge. (v5.23.1 : le rouge #e63946 remontait au v5.22.2.)
      const dash = Math.max(6, Math.round(7 * Math.pow(2, zoom - 14)));
      const gap = Math.round(dash * 0.85);
      // v5.22.6 : TIRETS ECHELLES SUR LE ZOOM - dasharray en pixels
      // ecran, les tirets se serraient au dezoom jusqu a fusionner
      // en ligne continue. Espacement ~doublable par niveau de zoom.
      p.setAttribute("stroke", "#e63946");
      p.setAttribute("stroke-width", 5);
      p.setAttribute("stroke-dasharray", dash + " " + (dash + 2 * gap));
      p.setAttribute("stroke-opacity", 0.9);
      p.setAttribute("stroke-linecap", "round");
      sg.appendChild(p);
      // 2e passe : VERT decalle d'un demi-periode -> tirets verts
      const p2 = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      p2.setAttribute("points", p.getAttribute("points"));
      p2.setAttribute("fill", "none");
      p2.setAttribute("stroke", "#2ecc71");
      p2.setAttribute("stroke-width", 5);
      p2.setAttribute("stroke-dasharray", dash + " " + (dash + 2 * gap));
      p2.setAttribute("stroke-dashoffset", dash + gap);
      p2.setAttribute("stroke-opacity", 0.9);
      p2.setAttribute("stroke-linecap", "round");
      sg.appendChild(p2);
    }
    world.appendChild(sg);
  }
}

  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

    drag = null;

    let z = pinch.z0 + Math.round(Math.log2(d / pinch.d0) * 2.5);

  const wasMoved = drag.moved;   // v5.13.4 : hit-test marqueur si non-drag
  if (drag.moved) {
    // glisse gauche (dx<0) => centre deplace de -dx => vers l'EST.
    // glisse bas (dy>0) => centre deplace de -dy => vers le NORD.
    const px = lon2x(drag.clon, zoom) - dx;
    const py = lat2y(drag.clat, zoom) - dy;

  if (!wasMoved) {

// la photo affichee ; si aucun media (journee sans photo), ancre =
// SONDE JAUNE (classicProbe) ; a defaut, zoom centre simple. La
// position de la SOURIS n'entre plus en jeu : zoome depuis le sud
// de la carte ne devait pas tirer la vue vers le sud.
mapEl.addEventListener("wheel", e => {
  e.preventDefault();
  const dir = e.deltaY < 0 ? 1 : -1;
  if ((dir > 0 && zoom >= ZMAX) || (dir < 0 && zoom <= ZMIN)) return;
  // 1. determiner l'ANCRE - v5.24.30 (retour 21/10) : la SONDE
  // prime sur la photo : posee par un tap explicite, c'est l'objet
  // que l'utilisateur regarde (cas reel : journee 21/10 sans media,

  // photo, incoherent avec le point jaune affiche). Sans sonde :
  // pointeur photo ; sinon zoom centre.
  let aLon = null, aLat = null;
  if (classicProbe) { aLon = classicProbe.lon; aLat = classicProbe.lat; }

// ---------- galerie ----------
// v5.8 : largeur de fenetre FIXE. Les photos publiees font RESIZE

// v5.13 : photo PORTRAIT - defilement vertical dans le cadre fixe.
// La miniature portrait fait 600 x H (H libre, ex. 800) : affichee
// pleine largeur, elle depasse le cadre -> glissement vertical borne
// (0 en haut, cadre-image en bas), petite main (cursor grab), depart
// CENTRE. Pointeur souris ET doigt (pointer events + setPointerCapture).
// v5.13.1 : badge d'invitation au glissement - le curseur grab est
// invisible sur Android ; ce badge visible pulse jusqu'au 1er glissement.
function enablePan(el) {
  if (el.classList.contains("tall")) return;   // v5.16.27 : idempotent
  el.classList.add("tall");
  const box = mediaEl;
  let top = 0, y0 = null, hint = null, hintTimer = null;
  function offHint() {
    if (hint) { hint.classList.add("off"); hint = null; }
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  }
  requestAnimationFrame(() => {
    const max = Math.min(0, box.clientHeight - el.offsetHeight);
    if (max === 0) { el.classList.remove("tall"); return; } // tient entier
    top = max / 2; el.style.top = top + "px";               // centre
    hint = document.createElement("div");
    hint.id = "panHint";
    hint.textContent = "⇕";
    hint.insertAdjacentHTML("beforeend", "<span style='font-size:15px;font-weight:700'>glisser</span>");
    box.appendChild(hint);
    hintTimer = setTimeout(offHint, 5000);   // lache apres 5 s sans glissement
  });
  el.addEventListener("pointerdown", e => {
    offHint();
    const max = Math.min(0, box.clientHeight - el.offsetHeight);
    if (max === 0) return;
    y0 = e.clientY - top; el.classList.add("drag");
    el.setPointerCapture(e.pointerId); e.preventDefault();
  });

    if (y0 === null) return;
    const max = Math.min(0, box.clientHeight - el.offsetHeight);
    top = Math.max(max, Math.min(0, e.clientY - y0));
    el.style.top = top + "px";
  });
  const fin = () => { y0 = null; el.classList.remove("drag"); };
  el.addEventListener("pointerup", fin);
  el.addEventListener("pointercancel", fin);
}

function openGal(i) {
  if (!media.length) return;
  sel = Math.max(0, Math.min(media.length - 1, i));
  const m = media[sel];
  mediaEl.innerHTML = "";

  if (m.type === "video") {
    el = document.createElement("video");

    el.src = m.url + "#t=0.1"; el.controls = true; el.playsInline = true;
    el.preload = "metadata";

  } else {
    el = document.createElement("img");
    el.src = m.url; el.alt = "";

    // v5.16.26 : en 2F photo+alti, TOUTES les photos sont PLEINE

    // paysage : max-height reduisait la largeur (letterbox lateral).
    // enablePan retire .tall tout seul si la photo tient entier et
    // affiche sinon le badge "glisser" (parties tronquees).

      // affiche sinon le badge "glisser" (parties tronquees).
      if (el.naturalHeight > el.naturalWidth
          || wrapEl.classList.contains("alti")) enablePan(el);
    });

  }
  mediaEl.appendChild(el);
  // v5.16.27 : filet de secours - si l'image est deja en cache, son
  // evenement "load" peut se declencher AVANT l'abonnement (course)
  // et enablePan n'a jamais ete appelee : photo PLEINE LARGEUR non
  // appliquee en 2F alti (letterbox lateral sur paysage en cache).
  if (el.complete && el.naturalWidth
      && wrapEl.classList.contains("alti")
      && !el.classList.contains("tall")) enablePan(el);
  capTxt.textContent = m.name;
  capDate.textContent = m.date;
  const cmtEl = document.getElementById("cmt");

  cmtEl.classList.toggle("on", !!m.commentaire);

  // zone admin : pre-remplir le champ commentaire si mode admin
  if (ADM) { document.getElementById("admTxt").value = m.commentaire || ""; }
  // le menu Date suit le media affiche
  if (profilOn) { syncPrDates(); drawProfil(false);   // v5.16.13 : contenu seul au defilement - geometrie immuable
                 if (wrapEl.classList.contains("p3")) centerActive(); }
  // v5.24 : barre du haut - 8 s a la 1re photo d'une NOUVELLE date
  // (ou au changement de date), disparition RAPIDE (1 s) au defile
  // des photos de la meme date.
  if (m.date !== barLastDate) { barLastDate = m.date; barFlash(8000); }
  else barFlash();                                    // v5.15.6 : barre flottante
  const dSel = document.getElementById("btDate");
  if (dSel.value !== m.date) dSel.value = m.date;
  applySel();
  clon = m.lon; clat = m.lat;
  render();   // recentrage uniquement a l'affichage d'un media
}

let cmtByUrl = {};
function parseCSVLine(line) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;

    } else {

    const r = await fetch(BASE + "/photos.csv?v=" + Date.now());
    if (!r.ok) return;
    const lines = (await r.text()).split(/\r?\n/).filter(Boolean);
    const head = parseCSVLine(lines[0]);
    const iDate = head.indexOf("date"), iNom = head.indexOf("nom"),
          iUrl = head.indexOf("url"), iCmt = head.indexOf("commentaire");
    if (iUrl < 0 || iCmt < 0) return;
    for (const l of lines.slice(1)) {
      const f = parseCSVLine(l);
      // v5.24.5 : le CSV porte nom AVEC extension, le geojson SANS ->
      // cle = nom sans extension (replace), sinon appariement raté.
      if (f.length >= head.length && f[iCmt])
        cmtByUrl[f[iDate] + "/" +
                 f[iNom].replace(/\.(jpg|jpeg|mp4)$/i, "")] = f[iCmt];
    }
    // appliquer aux medias deja charges et rafraichir l'affichage
    let changed = false;
    for (const m of media) {
      const c = cmtByUrl[m.date + "/" + m.name];
      if (c && c !== m.commentaire) { m.commentaire = c; changed = true; }
    }
    if (changed && sel >= 0) {
      const c = document.getElementById("cmt");
      c.textContent = media[sel].commentaire || "";
      c.classList.toggle("on", !!media[sel].commentaire);
    }
  } catch (e) { /* photos.csv absent : commentaires geojson seulement */ }
}

// Le token (PAT GitHub a portee depot, Contents read+write) ne figure QUE

// famille/amis n'ont pas de #adm= -> pas de zone de saisie.

const ADM = H.get("adm") || null;

document.getElementById("admSave").onclick = async () => {
  const btn = document.getElementById("admSave"), m = media[sel];
  if (!m) return;
  if (!ADM || !REPO) {   // diagnostiquer au lieu de quitter silencieusement
    btn.textContent = "✖ Mode admin indisponible (token ou REPO manquant)";
    setTimeout(() => btn.textContent = "💾 Enregistrer", 4000);
    return;
  }
  const txt = document.getElementById("admTxt").value.trim();
  btn.textContent = "…";
  try {
    // 1. relire le CSV courant via l'API (donne aussi le sha du fichier)
    const g = await fetch("https://api.github.com/repos/" + REPO + "/contents/photos.csv",
                          { headers: { Authorization: "Bearer " + ADM, Accept: "application/vnd.github+json" } });
    if (!g.ok) throw new Error("lecture CSV : HTTP " + g.status);
    const meta = await g.json();
    const lines = new TextDecoder().decode(
      Uint8Array.from(atob(meta.content.replace(/\n/g, "")), c => c.charCodeAt(0)))
      .split(/\r?\n/).filter(Boolean);
    // 2. mettre a jour la ligne du media (cle : date|nom - v5.24.4)
    const head = parseCSVLine(lines[0]);
    const iUrl = head.indexOf("url"), iCmt = head.indexOf("commentaire");
    const iDate2 = head.indexOf("date"), iNom2 = head.indexOf("nom");
    let hit = false;
    for (let i = 1; i < lines.length; i++) {
      const f = parseCSVLine(lines[i]);
      if (f[iDate2] === m.date &&
          f[iNom2].replace(/\.(jpg|jpeg|mp4)$/i, "") === m.name) {
        // re-encoder la ligne avec le commentaire cite s'il contient virgules/quotes
        f[iCmt] = txt; hit = true;
        lines[i] = f.map(x => /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x).join(",");
      }
    }
    if (!hit) throw new Error("ligne introuvable dans photos.csv");
    // 3. commit via l'API (seul photos.csv est republie - pas les medias)
    const body = lines.join("\n") + "\n";
    const b64 = btoa(String.fromCharCode(...new TextEncoder().encode(body)));
    const p = await fetch("https://api.github.com/repos/" + REPO + "/contents/photos.csv", {
      method: "PUT",
      headers: { Authorization: "Bearer " + ADM, Accept: "application/vnd.github+json" },
      body: JSON.stringify({
        message: "commentaire " + m.name + " (" + m.date + ")",
        content: b64, sha: meta.sha })
    });
    if (!p.ok) throw new Error("commit : HTTP " + p.status);
    m.commentaire = txt; cmtByUrl[m.date + "/" + m.name] = txt;
    const c = document.getElementById("cmt");
    c.textContent = txt; c.classList.toggle("on", !!txt);
    btn.textContent = "✔ Enregistré";
  } catch (e) { btn.textContent = "✖ Erreur : " + e.message; }
  setTimeout(() => btn.textContent = "💾 Enregistrer", 3000);
};

function photoEpoch(m) {

    // conteneur (du haut visible au bas de la fenetre).
    const rMwB = document.getElementById("mapwrap")
                   .getBoundingClientRect();
    const visTopB = Math.max(rMwB.top, 0);
    const maxPaneH = Math.max(120,
      Math.round(window.innerHeight - visTopB - 8));
    let ph = Math.round(mwH * 0.35);   // overlay laptop
    if (ph > maxPaneH) ph = maxPaneH;
    pan.style.flex = ""; pan.style.marginTop = "";
    pan.style.height = ph + "px";
  }
  const svg = document.getElementById("prSvg");
  // v5.16.7 : mesurer le RECTANGLE REEL du panneau (getBoundingClientRect)
  // et piloter le SVG en PIXELS EXPLICITES, BORNES par le bas du
  // conteneur carte - quel que soit l'etat de hauteur (sain ou residuel
  // d'un passage en 1F alti), le graphe ne peut PLUS deborder : au pire
  // il est legerement plus petit, jamais coupe.
  const rPan = pan.getBoundingClientRect();
  const rMw = document.getElementById("mapwrap").getBoundingClientRect();
  const chipsEl = document.getElementById("prChips");
  const chipsH = getComputedStyle(chipsEl).position !== "absolute"
                 ? chipsEl.offsetHeight : 0;
  // v5.16.11 : STABILITE au defilement des photos - la geometrie est
  // figee tant que le MODE ne change pas (className). Avant, chaque
  // trace re-mesurait une hauteur en transition : au changement de
  // photo, le 1er tracé (sync) affichait un graphe trop grand, coupe
  // (58m en bas), corrige par les traces deferres (3m) -> scintille-
  // ment en 2F photo+alti. Desormais, un changement de photo REUTILISE
  // la hauteur valide du mode courant : un seul affichage, stable.
  // v5.16.12 : cle de cache = CLASSES DE MODE SIGNIFICATIVES uniquement
  // (v5.16.11 utilisait wrapEl.className ENTIER : la classe transitoire
  // "baron" du flash de barre changeait a CHAQUE photo -> cache jamais
  // atteint -> re-mesure en pleine transition = scintillement persistant).
  const modeKey = ["single","showmap","showprofil","alti","p3"]
    .filter(c => wrapEl.classList.contains(c)).join(",") + "|"
    + window.innerWidth;
  let H, W;
  if (modeKey === lastPrMode && lastPrH > 0 && lastPrW > 0) {
    H = lastPrH; W = lastPrW;
    // v5.24.22 : FIX troncature HAUT (laptop, 2e retour 21/10) - la
    // borne v5.24.21 (hauteur prWrap) ne suffisait pas : quand le
    // panneau est AGANDI via la poignee ⌄ au-dela de la zone visible
    // de la carte, prWrap garde sa hauteur de LAYOUT (plus grande que
    // la zone VISIBLE) -> haut du graphe + echelle de temps coupes
    // (reproduit : deselectionner la journee du refresh puis en
    // selectionner une autre - les puces ne re-mesurent pas, modeKey
    // inchange = branche cache). On applique la MEME borne que la
    // branche de mesure : H bute sur la zone visible du conteneur
    // carte (visTop -> bas de carte).
    // v5.24.25 : idem branche CACHEE - borne par prWrap ACTUEL
    // (simple et direct : le SVG ne peut pas depasser son conteneur).
    const rPrWc = document.getElementById("prWrap").getBoundingClientRect();
    if (H > Math.round(rPrWc.height) - 4) H = Math.round(rPrWc.height) - 4;
    if (H < 60) H = 60;
    lastPrH = H;
    W = Math.max(120, W);
  } else {
    // v5.24.25 : MESURE DIRECTE de prWrap (conteneur reel du SVG) -
    // preuve console 21/10 : H=240 px alors que prWrap n'affiche que
    // 168 px -> bas du SVG CLIPPE : echelle horaire du BAS (journees
    // dont la courbe vit en haut) et etiquette de grille la plus
    // basse invisibles. La formule "panneau - puces - 12" restait
    // vulnerable aux etats transitoires ; prWrap (flex:1) EST la
    // place exacte disponible, au moment present.
    const rPrW = document.getElementById("prWrap").getBoundingClientRect();
    H = Math.max(60, Math.round(rPrW.height) - 4);
    // v5.16.8 : borne aussi par le HAUT - si le panneau (absolute,
    // bottom:0) depasse au-dessus du conteneur (hauteur residuelle trop
    // grande), la partie visible commence au top du conteneur : sans
    // cette borne le SVG etait trace plus haut que la zone visible et
    // son bas etait coupe (cas 2F photo+alti apres 1F alti).
    const visTop = Math.max(rPan.top, rMw.top);
    const maxH = Math.round(rMw.bottom - visTop) - 12;  // butee bas de carte
    if (H > maxH) H = maxH;
    if (H < 60) H = 60;
    W = Math.max(120, Math.round(rPan.width) - 16);
    // v5.24.16 : TRONCATURE BAS DE COURBE (retour 21/10, laptop) :
    // le tracé PARTIEL etait deja borne par la hauteur VISIBLE du
    // wrapper (fix v5.16.19), pas le tracé COMPLET. A la SELECTION
    // d'une date, la ligne de puces grandit/enveloppe -> la zone
    // visible retrecit, mais H (mesure panneau - puces - 12) restait
    // plus grand -> bas de l'echelle et bas de courbe hors ecran,
    // surtout en grande amplitude / altitude min proche de 0. On
    // applique la MEME borne que le chemin partiel.
    const wrapR0 = document.getElementById("prWrap").getBoundingClientRect();
    const visH0 = Math.round(wrapR0.height);
    if (H > visH0) H = visH0;
    if (H < 60) H = 60;
    lastPrMode = modeKey; lastPrH = H; lastPrW = W;
  }
  svg.style.width = W + "px"; svg.style.height = H + "px";
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.innerHTML = ""; prMap = null;
  drawProfilContent(svg, W, H);
  lastDrawnH = H;                           // v5.16.22 : reference du seuil 20 px
}
// v5.16.13 : corps de tracé commun (plein et contenu-seul)
function drawProfilContent(svg, W, H) {
  if (!profilData || !prDates.size) return;
  // v5.14.1 : journees mises BOUT A BOUT sur un axe virtuel -> les
  // nuits ne creent plus d'espaces vides ; chaque journee occupe une
  // largeur proportionnelle a sa duree reellement tracee.
  // v5.22 : en MODE DIRECT, le graphe ne trace QUE la journee live,
  // construite depuis live_trace.geojson (ele + times de live.py v1.1).
  const blocks = liveMode
    ? (livePts.filter(p => p.ele != null).length >= 2
       ? [{ d: live.date,
            pts: livePts.filter(p => p.ele != null)
                        .map(p => [p.t * 1000, p.ele]) }]
       : [])
    : [...prDates].sort().map(d => {
    const a = (profilData.dates[d] || []).map(([t, e]) => [t * 1000, e]);
    a.sort((x, y) => x[0] - y[0]);
    return { d: d, pts: a };

  if (!blocks.length) return;
  let npts = 0, off = 0;
  for (const b of blocks) {
    b.t0 = b.pts[0][0]; b.t1 = b.pts[b.pts.length - 1][0];
    b.dur = Math.max(1, b.t1 - b.t0); b.off = off; off += b.dur;
    npts += b.pts.length;

  if (npts < 2) return;
  let emin = Infinity, emax = -Infinity;
  for (const b of blocks) for (const p of b.pts) {
    if (p[1] < emin) emin = p[1]; if (p[1] > emax) emax = p[1];
  }
  const mg = Math.max(10, (emax - emin) * 0.15);

  const X = t => {
    for (const b of blocks)

        return 42 + (b.off + (t - b.t0)) / Vtot * (W - 54);
    return null;                          // hors journees selectionnees

  prMap = { blocks: blocks, Vtot: Vtot, X: X, Y: Y, emin: emin, emax: emax, W: W };
  for (let i = 0; i <= 4; i++) {          // grille horizontale + cotes
    const e = emin + (emax - emin) * i / 4;
    const ln = document.createElementNS(NSVG, "line");
    ln.setAttribute("x1", 42); ln.setAttribute("x2", W - 12);
    ln.setAttribute("y1", Y(e)); ln.setAttribute("y2", Y(e));
    ln.setAttribute("stroke", "#26304a"); svg.appendChild(ln);
    const tx = document.createElementNS(NSVG, "text");
    tx.setAttribute("x", 2); tx.setAttribute("y", Y(e) + 4);
    tx.setAttribute("fill", "#8a94b0"); tx.setAttribute("font-size", "11");
    tx.textContent = Math.round(e) + "m"; svg.appendChild(tx);
  }
  for (let bi = 0; bi < blocks.length; bi++) {   // une courbe par journee
    const b = blocks[bi];

    const pl = document.createElementNS(NSVG, "polyline");

    pl.setAttribute("stroke", prColor(b.d)); pl.setAttribute("stroke-width", "2");

    // DISTANCE garmin (0..1). >= 85 % -> "garmin" VERT ; <= 15 % ->
    // "gpslogger" ROUGE NON BARRE (seule la forme courte "g" est
    // barree) ; sinon "mixte" ORANGE. Forme courte (g/m) si plus
    // de 3 journees affichees, mot entier sinon.
    // v5.24.11 : en MODE DIRECT, la courbe est TOUJOURS construite
    // depuis live_trace.geojson (source gpslogger, largement moins
    // precise que le barometre garmin) -> badge ROUGE affiche d'office

    if (liveMode) {

      const x0l = X(b.t0);
      if (x0l != null) {
        const btl = document.createElementNS(NSVG, "text");
        btl.setAttribute("x", x0l + 4); btl.setAttribute("y", 12);
        btl.setAttribute("text-anchor", "start");
        // v5.24.12 : badge live aussi agrandi (14 px, comme le
        // classique en 1F/2F - retour 21/10).
        btl.setAttribute("font-size", "14");
        btl.setAttribute("font-weight", "700");
        btl.setAttribute("fill", "#e07b7b");
        btl.textContent = "gpslogger"; svg.appendChild(btl);
      }
    } else if (srcData) {
      const frac = srcData[b.d];
      if (frac != null) {
        // v5.24.16 : mots ENTIERS jusqu'a 10 dates selectionnees
        // (retour 21/10 - etait <= 3) ; formes courtes au-dela.
        // Couleurs inchangees.
        const plein = blocks.length <= 10;
        let txt, col, strike = false;
        // v5.24.13 : CORRECTION du critere - le 3F mobile est la classe
        // p3 (la classe alti = 1F/2F alti, d'ou l'inversion observee
        // en v5.24.12 : 3F agrandi, 2F non). On agrandit donc en 1F
        // ET 2F (pas de p3), on garde la taille d'origine en 3F.
        const fsBadge = !wrapEl.classList.contains("p3")
                        ? 14 : (plein ? 10 : 11);
        if (frac >= 0.85) { txt = plein ? "garmin" : "g"; col = "#9fd6a0"; }
        else if (frac <= 0.15) {
          txt = plein ? "gpslogger" : "g"; col = "#e07b7b";
          strike = !plein;             // v5.24.1 : mot entier NON barre

        else { txt = plein ? "mixte" : "m"; col = "#e8a04c"; }   // orange
        const x0 = X(b.t0), x1 = X(b.t1);
        if (x0 != null && x1 != null) {
          const bx = x0 + 4;           // v5.24.1 : DEBUT de section

          bt.setAttribute("text-anchor", "start");
          bt.setAttribute("font-size", fsBadge);
          bt.setAttribute("font-weight", "700");
          bt.setAttribute("fill", col);
          bt.textContent = txt; svg.appendChild(bt);
          if (strike) {                 // barre le "g" court (gpslogger)
            const bl = document.createElementNS(NSVG, "line");
            const w = bt.getComputedTextLength ? bt.getComputedTextLength() : 30;

            bl.setAttribute("y1", by); bl.setAttribute("y2", by);
            bl.setAttribute("stroke", col); bl.setAttribute("stroke-width", "1.2");
            svg.appendChild(bl);
          }
        }
      }
    }
    if (bi > 0) {                        // separateur discret entre journees
      const sx = X(b.t0);
      const sl = document.createElementNS(NSVG, "line");
      sl.setAttribute("x1", sx); sl.setAttribute("x2", sx);
      sl.setAttribute("y1", 4); sl.setAttribute("y2", H - 16);
      sl.setAttribute("stroke", "#39445c");
      sl.setAttribute("stroke-dasharray", "3 4"); svg.appendChild(sl);
    }
  }
  // v5.20/v5.21 : ECHELLE TEMPORELLE ADAPTATIVE.
  // v5.24.21 (retour 21/10, smartphone) : AU-DELA DE 2 journees on
  // affiche DESormais les DATES jj/mm (etait 5+) - la regle unifiee :
  // 1-2 journees -> heures (1 h / 2 h) + DATE jj/mm au bas-centre
  // de CHAQUE journee (meme taille/couleur que les heures) ;
  // 3 journees et plus -> dates jj/mm seules (format 5+ conserve).
  //  - laptop (fenêtre large, placement dynamique conserve haut/bas
  //    selon où vit la courbe) : 1 journée -> 30 min ; 2 -> 1 h.
  // Police 9 px discrete, micro-tirets, anti-collision 36 px.
  const nbJ = blocks.length;
  const stepH = MOBILE
    ? (nbJ === 1 ? 1 : nbJ === 2 ? 2 : 0)
    : (nbJ === 1 ? 0.5 : nbJ === 2 ? 1 : 0);
  let topN = 0, botN = 0;
  const emid = (emin + emax) / 2;
  for (const b of blocks) for (const p of b.pts) (p[1] >= emid ? topN++ : botN++);
  // v5.21 : mobile TOUJOURS en bas ; laptop garde le placement dynamique
  const tY = MOBILE ? H - 6 : (topN > botN ? H - 6 : 18);
  let lastX = -99;
  for (let bi = 0; bi < blocks.length; bi++) {
    const b = blocks[bi];
    const mkTick = (t, label) => {
      const x = X(t);
      if (x == null || x < 44 || x > W - 34 || x - lastX < 36) return;
      lastX = x;
      const tx = document.createElementNS(NSVG, "text");
      tx.setAttribute("x", x); tx.setAttribute("y", tY);
      tx.setAttribute("fill", "#8a94b0"); tx.setAttribute("font-size", "9");
      tx.setAttribute("text-anchor", "middle");
      tx.textContent = label; svg.appendChild(tx);
      const tk = document.createElementNS(NSVG, "line");   // micro-repere
      tk.setAttribute("x1", x); tk.setAttribute("x2", x);
      tk.setAttribute("y1", tY === 18 ? tY + 2 : tY - 10);
      tk.setAttribute("y2", tY === 18 ? tY + 6 : tY - 6);
      tk.setAttribute("stroke", "#39445c"); svg.appendChild(tk);
    };
    if (stepH > 0) {                       // reperes horaires dans la journee
      const st = stepH * 3600000;
      const d0 = new Date(b.t0);           // aligne sur l'heure ronde locale
      let t = b.t0 + (st - (d0.getMinutes() * 60000 + d0.getSeconds() * 1000
                + d0.getMilliseconds()) % st) % st;
      for (; t <= b.t1; t += st) {
        const dt = new Date(t);            // v5.21 : "8 h" ou "8 h 30"
        mkTick(t, dt.getMinutes()
                 ? dt.getHours() + " h " + dt.getMinutes()
                 : dt.getHours() + " h");
      }
      // v5.24.21 : smartphone, 1-2 journees -> DATE jj/mm au
      // BAS-CENTRE de la journee, juste AU-DESSUS de l'echelle des
      // heures (meme taille 9 px, meme couleur #8a94b0).
      if (MOBILE) {
        const dc = document.createElementNS(NSVG, "text");
        dc.setAttribute("x", X(b.t0 + (b.t1 - b.t0) / 2));
        dc.setAttribute("y", tY - 12);      // au-dessus des heures
        dc.setAttribute("fill", "#8a94b0");
        dc.setAttribute("font-size", "9");
        dc.setAttribute("text-anchor", "middle");
        dc.textContent = new Date(b.t0).toLocaleDateString("fr-FR",
          { day: "2-digit", month: "2-digit" });
        svg.appendChild(dc);
      }
    } else {                               // dates seules (3+ journees)
      mkTick(b.t0 + (b.t1 - b.t0) / 2,
             new Date(b.t0).toLocaleDateString("fr-FR",
               { day: "2-digit", month: "2-digit" }));
    }

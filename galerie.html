  // position courante + sonde (jaune) au point tape, sur le graphe.
  if (liveMode) {
    const cur = (t, col, big) => {
      const x = X(t * 1000);
      if (x == null) return;
      const ln = document.createElementNS(NSVG, "line");
      ln.setAttribute("x1", x); ln.setAttribute("x2", x);
      ln.setAttribute("y1", 4); ln.setAttribute("y2", H - 16);
      ln.setAttribute("stroke", col); ln.setAttribute("stroke-width", "2");
      ln.setAttribute("stroke-dasharray", "5 4"); svg.appendChild(ln);
      const tx = document.createElementNS(NSVG, "text");
      tx.setAttribute("x", Math.min(x + 4, W - 46)); tx.setAttribute("y", big ? 20 : 34);
      tx.setAttribute("fill", col); tx.setAttribute("font-weight", "700");
      tx.setAttribute("font-size", big ? "15" : "11");
      tx.textContent = fmtH(t); svg.appendChild(tx);
    };

    if (live && live.t)
      cur(live.t, liveMoving() ? "#2ecc71" : "#8a94b0", true);
    if (liveProbe) cur(liveProbe.t, "#ffd60a", false);

}
function profilCursor() {
  if (liveMode) return;              // v5.22 : en direct, curseurs live/sonde only
  // v5.24.17 : la SONDE classique se dessine MEME sans media (journee
  // gpx sans photo : l'ancien return figeait tout au debut de journee).
  if (!profilOn || !prMap) return;
  const svg = document.getElementById("prSvg");
  svg.querySelectorAll(".prCur").forEach(x => x.remove());
  // v5.24.17 : CURSEUR SONDE (jaune) - position cliquee sur la courbe
  // ou sur la trace carte. Independant du curseur photo.
  if (classicProbe) {
    let pb = null;
    for (const b of prMap.blocks)
      if (classicProbe.t * 1000 >= b.t0 && classicProbe.t * 1000 <= b.t1)
        { pb = b; break; }
    if (pb) {
      const px = 42 + (pb.off + (classicProbe.t * 1000 - pb.t0))
                 / prMap.Vtot * (prMap.W - 54);
      const pl = document.createElementNS(NSVG, "line");
      pl.setAttribute("class", "prCur");
      pl.setAttribute("x1", px); pl.setAttribute("x2", px);
      pl.setAttribute("y1", 4); pl.setAttribute("y2", prMap.Y(prMap.emin));
      pl.setAttribute("stroke", "#ffd60a");
      pl.setAttribute("stroke-width", "2");
      pl.setAttribute("stroke-dasharray", "5 4");   // distingue du curseur photo
      svg.appendChild(pl);
    }
  }
  if (!media[sel]) return;           // journee sans media : sonde seule
  const t = photoEpoch(media[sel]);
  if (t === null) return;
  // v5.14.2 : journee la plus PROCHE, puis position bornee aux bornes
  // de la trace -> le curseur reste visible au DEBUT de la courbe pour
  // une photo prise avant l'allumage du GPS, et a la FIN pour une photo
  // prise apres l'extinction (au lieu de disparaitre).
  let blk = prMap.blocks.find(b => t >= b.t0 && t <= b.t1);
  if (!blk) {
    let bd = Infinity;
    for (const b of prMap.blocks) {
      const dd = t < b.t0 ? b.t0 - t : t - b.t1;
      if (dd < bd) { bd = dd; blk = b; }
    }
    if (!blk) return;
  }
  const tc = Math.min(Math.max(t, blk.t0), blk.t1);   // heure bornee dans la trace
  const x = 42 + (blk.off + (tc - blk.t0)) / prMap.Vtot * (prMap.W - 54);
  // altitude interpolee dans la journee (a l'heure bornee tc)
  let e = blk.pts[0][1];
  for (let i = 0; i < blk.pts.length; i++)
    if (blk.pts[i][0] >= tc) {
      if (i === 0) e = blk.pts[0][1];
      else { const [t1, e1] = blk.pts[i - 1], [t2, e2] = blk.pts[i];
             e = e1 + (e2 - e1) * (tc - t1) / (t2 - t1); }
      break;
    }
  const ln = document.createElementNS(NSVG, "line");
  ln.setAttribute("class", "prCur");
  ln.setAttribute("x1", x); ln.setAttribute("x2", x);
  ln.setAttribute("y1", 4); ln.setAttribute("y2", prMap.Y(prMap.emin));
  // v5.24.9 : curseur photo JAUNE (#ffd60a, comme la sonde live - plus
  // visible sur fond noir que l'orange #ff7a00) + heure AJOUTEE a
  // l'altitude dans l'etiquette.
  ln.setAttribute("stroke", "#ffd60a"); ln.setAttribute("stroke-width", "2");
  svg.appendChild(ln);
  const dot = document.createElementNS(NSVG, "circle");
  dot.setAttribute("class", "prCur");
  dot.setAttribute("cx", x); dot.setAttribute("cy", prMap.Y(e));
  dot.setAttribute("r", 5); dot.setAttribute("fill", "#ffd60a");
  svg.appendChild(dot);
  const tx = document.createElementNS(NSVG, "text");
  tx.setAttribute("class", "prCur");
  tx.setAttribute("x", Math.min(x + 6, svg.clientWidth - 78));
  // v5.24.10 : etiquette SOUS le point (Y(e)+16) - au-dessus elle
  // etait masquee par la poignee orange ⌄ centree en haut quand le
  // point vit en haut de courbe (retour 21/10). Repli AU-DESSUS si
  // le bas de la fenetre manquerait de place (points bas de courbe).
  const yBas = prMap.Y(e) + 16, yHaut = prMap.Y(e) - 8;
  const yMax = svg.clientHeight - 8;
  tx.setAttribute("y", yBas > yMax ? yHaut : yBas);
  tx.setAttribute("fill", "#ffd60a"); tx.setAttribute("font-size", "12");
  tx.setAttribute("font-weight", "700");
  tx.textContent = fmtH(tc / 1000) + "  " + Math.round(e) + "m";
  svg.appendChild(tx);
}
// v5.24.20 : GLISSE HORIZONTAL dans la fenetre alti (smartphone) :
// glisse vers la GAUCHE -> journee SUIVANTE (graphe seul sur cette
// journee + 1re photo de la journee ouverte + carte centree) ;
// glisse vers la DROITE -> journee PRECEDENTE (+ DERNIERE photo de
// la journee + carte centree).
// v5.24.29 (retour 21/10) : la REFERENCE n'est plus la photo affichee
// mais le GRAPHE ALTI lui-meme. Cas reel : 21/10 (sans media) selec-
// tionnee dans l'alti, galerie sur une photo du 13/10 -> le glisse
// partait du 13/10 (photo) et sautait au 12/10 au lieu du 13/10
// attendu. Desormais : selection SOLO -> cette date ; selection
// MULTIPLE -> l'EXTREMITE dans le sens du glisse (suivant = apres la
// plus RECENTE, precedent = avant la plus ANCIENNE) ; graphe vide ->
// photo affichee (ancien comportement, repli).
let lastSwipeT = 0;
function prSwipeDir(dayDir) {
  if (!profilData || !profilData.dates) return;
  const dispo = Object.keys(profilData.dates).sort();
  if (!dispo.length) return;
  let ref = null;
  if (prDates.size === 1) ref = [...prDates][0];       // cas nominal
  else if (prDates.size > 1)
    ref = dayDir > 0 ? [...prDates].sort().pop()       // la plus recente
                     : [...prDates].sort()[0];         // la plus ancienne
  else ref = (media[sel] && media[sel].date) || null;  // repli : photo
  if (!ref) return;
  let cible = null;
  if (dayDir > 0) { for (const d of dispo) if (d > ref) { cible = d; break; } }
  else { for (let i = dispo.length - 1; i >= 0; i--)
           if (dispo[i] < ref) { cible = dispo[i]; break; } }
  if (!cible) return;              // deja la 1re/derniere journee
  // selection manuelle = CETTE journee seule (les puces suivent)
  prManual = new Set([cible]); prTouched = true;
  prDates = new Set([cible]);
  document.querySelectorAll(".prChip").forEach(c =>
    c.classList.toggle("on", c.textContent === cible));
  drawProfil();
  // photo de la journee cible : 1re (glisse gauche) ou derniere
  // (glisse droite) par horodatage - centrer la carte dessus.
  let bi = -1, bt = dayDir > 0 ? Infinity : -Infinity;
  for (let i = 0; i < media.length; i++) {
    if (media[i].date !== cible) continue;
    const pt = photoEpoch(media[i]);
    if (pt === null) continue;
    if (dayDir > 0 ? pt < bt : pt > bt) { bt = pt; bi = i; }
  }
  if (bi >= 0) { openGal(bi); centerActive(); }
}
(function () {   // capteurs tactiles sur le panneau alti
  let sx = 0, sy = 0, st = 0;
  // v5.24.31 : double-tap TACTILE sur la courbe (retour 21/10) - sur
  // smartphone, le 2e tap n'emet pas toujours de click (geste zoom
  // natif du navigateur) : la detection par click (laptop) ne suffit
  // pas. Meme regle : 2 taps < 350 ms, < 30 px d'ecart -> photo la
  // plus proche (+ recentrage carte) ; le simple tap reste la sonde.
  let lastTT = 0, lastTX = 0, lastTY = 0;
  const pan = document.getElementById("prSvg");
  pan.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { st = 0; lastTT = 0; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    st = Date.now();
  }, { passive: true });
  pan.addEventListener("touchend", e => {
    if (!st || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > 2 * Math.abs(dy)) {
      lastSwipeT = Date.now();
      prSwipeDir(dx < 0 ? 1 : -1);   // gauche = suivante, droite = precedente
      lastTT = 0;
      return;
    }
    // v5.24.31 : pas un glisse -> DOUBLE-TAP ?
    const now = Date.now();
    const r = pan.getBoundingClientRect();
    const x = e.changedTouches[0].clientX - r.left;
    const y = e.changedTouches[0].clientY - r.top;
    if (now - lastTT < 350 && Math.hypot(x - lastTX, y - lastTY) < 30) {
      lastSwipeT = Date.now();       // neutralise le click residuel
      graphDoubleTap(x);
      lastTT = 0;
    } else { lastTT = now; lastTX = x; lastTY = y; }
  }, { passive: true });
})();

  // v5.24.19 : DOUBLE-TAP sur la courbe = photo la plus proche

  probeFromGraphClassic(gx);
});

// v5.16.18 : le badge v5.16.17 a montre la cause exacte : l'animation
// de la barre d'URL produit des paliers espaces de ~140 ms - CHACUN
// survivait au debounce de 120 ms et declenchait son propre tracé FULL
// (H decroissant 330->311 par paliers). Fix : debounce porte a 400 ms
// (les paliers ~140 ms le re-arment en continu, l'animation est
// entierement absorbee) + un seul tracé a la stabilisation.
// v5.16.22 : la vraie cause etait l'AMPLITUDE, pas la cadence : les
// badges successifs montrent des paliers de seulement 4 PX (311->314->
// 318->322->326->330) - la barre d'URL anime le panneau par micro-pas,
// et CHAQUE micro-pas (quelle que soit sa cadence, 140/440/640 ms)
// declenchait un tracé FULL complet. Regle definitive : ne retracer
// que si la hauteur s'est écartee de >= 20 PX depuis le dernier tracé
// (seuil sans effet visuel) ; rotation (largeur) reste IMMEDIATE.
let lastDrawnH = -1, roLastW = -1, settleT = null;
function sizeSettledRedraw(h, w) {
  const wChanged = w !== roLastW;
  const hDelta = Math.abs(h - lastDrawnH);
  roLastW = w;
  if (!profilOn) return;
  if (wChanged || hDelta >= 20) {
    if (settleT) { clearTimeout(settleT); settleT = null; }
    lastPrMode = null; drawProfil();   // lastDrawnH mis a jour par drawProfil
  } else {
    // v5.16.23 : le seuil de 20 px supprimait le scintillement MAIS
    // aussi le tracé FINAL (si l'etat stable est a <20 px du dernier
    // tracé, il n'etait JAMAIS redessine -> "58m" rogne persistant).
    // Filet de securite : tracé unique apres 800 ms sans changement
    // (l'animation, quelle que soit sa cadence, ne le declenche qu'a
    // sa fin ; aucun tracé intermediaire n'est affiche avant).
    if (settleT) clearTimeout(settleT);
    settleT = setTimeout(() => {
      settleT = null;
      if (profilOn) { lastPrMode = null; drawProfil(); }
    }, 800);
  }
}
window.addEventListener("resize", () => {
  sizeSettledRedraw(Math.round(document.getElementById("profil").offsetHeight),

});
new ResizeObserver(entries => {
  if (!profilOn) return;
  const r = entries[0].contentRect;

})

async function fetchJ(name) {
  // parametre anti-cache : chaque ouverture de page retelecharge les
  // cumulatifs a jour (sinon le navigateur sert la version en cache,
  // ex. apres une purge les anciennes dates restent affichees)
  const r = await fetch(BASE + "/" + name + "?v=" + Date.now());
  if (!r.ok) throw new Error(name + " : HTTP " + r.status);
  return r.json();
}
function fail(msg) { errEl.textContent = "Erreur de chargement : " + msg; errEl.style.display = "block"; }
async function load() {
  try {
    media = [];

      let j; try { j = await fetchJ(f); } catch (e) { if (type === "video") continue; throw e; }
      for (const ft of (j.features || [])) {
        const p = ft.properties || {};

          type, name: p.name || "", date: p.date || "", commentaire: p.commentaire || "",
          // v5.24.5 : le geojson porte name SANS EXTENSION (build_daily
          // rsplit '.' - v5.24.4 oubliait .jpg/.mp4 -> 404 -> cadre noir,
          // retour 21/10). Extension retablie selon le type du media.
          url: BASE + "/photos/" + (p.date || "") + "/" + (p.name || "")
               + (type === "video" ? ".mp4" : ".jpg"),
          lon: ft.geometry.coordinates[0], lat: ft.geometry.coordinates[1],
          color: ((p._umap_options || p._storage_options || {}).color) || "#3388ff"
        });
      }
    }
    media.sort((a, b) => (a.date + "|" + a.name).localeCompare(b.date + "|" + b.name));
    media.forEach((m, i) => m.i = i);

    // - necessaires a la sonde croisee classique (carte <-> profil).

    catch (e) { kmData = null; }

  for (const tr of traces) {
    if (!tr.geometry) continue;
    for (const c of tr.geometry.coordinates) {
      if (c[0] < lo0) lo0 = c[0]; if (c[0] > lo1) lo1 = c[0];
      if (c[1] < la0) la0 = c[1]; if (c[1] > la1) la1 = c[1];

  for (let z = ZMAX; z > ZMIN; z--) {

        && lat2y(la0, z) - lat2y(la1, z)
           <= (mapEl.clientHeight - profH) * 0.9) break;

  const pas = Math.max(1, Math.ceil(media.length / 40));  // ~40 ticks / 12 s
  homePlay = setInterval(() => {
    if (!document.getElementById("homeP")) { homePlaybackStop(); return; }
    let i = sel + pas;
    if (i >= media.length) i = 0;                         // boucle (page figee)
    openGal(i);          // curseur : carte + alti suivent (galerie couverte)
    centerActive();
  }, 300);
}
function homePlaybackStop() {
  if (homePlay) { clearInterval(homePlay); homePlay = null; }
}
// v5.24.37 : retour au MODE CLASSIQUE apres l'accueil (laptop comme
// mobile) - 1re photo de la journee la plus RECENTE ayant un media,
// carte centree (zoom/centre d'origine), alti = graph de CETTE date
// (les selections "toutes dates" de l'accueil laptop sont purgees).
function restoreNominal() {
  const lastDate = [...new Set(media.map(m => m.date))].sort().pop();
  const i = lastDate ? media.findIndex(m => m.date === lastDate) : -1;
  if (i >= 0) openGal(i);
  prManual = new Set(); prTouched = false;
  syncPrDates(); drawProfil();
  if (homeSaved) {
    zoom = homeSaved.zoom; clon = homeSaved.lon; clat = homeSaved.lat;
    homeSaved = null;
  }
  centerActive();
}
function showHomePage(laptop) {
  if (document.getElementById("homeP")) return;

  const d = document.createElement("div");
  d.id = "homeP";

  d.innerHTML = homeCyclistSVG()

  d.onclick = () => {

}

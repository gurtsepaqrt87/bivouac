<!doctype html>
<html lang="fr">
<!-- VERSION v5.16.5 : chercher "v5.16" (Ctrl+U, Ctrl+F).
     v5.16.5 = CRITIQUE : v5.16.4 cassait TOUTE la page (photo vide,
     carte bleue sans tuiles) - render() testait la variable profilOn,
     declaree PLUS BAS dans le script, alors que render() est appele
     AVANT (updateSingle a l'initialisation) -> ReferenceError TDZ.
     Le test est desormais DOM (pan .on), sans variable.
     v5.16.4 = cadrage zone visible + hauteur alti en pixels.
     v5.16.3 = purge du graphe SVG a la fermeture.
     v5.16.2 = redessin differe (rAF + 150 ms) + ResizeObserver panneau.
     v5.16.1 = boutons ⇅/⧉ alti 1F en z-index 1600.
     v5.16 = (1) ouverture smartphone : mode "3 FENETRES" par defaut
     (photo+carte+alti, comme si ⛰ de la carte etait active) ;
     (2) en 3F : carte RECENTREE sur la photo affichee + marqueurs
     reduits d'1/3 (2F photo+carte inchange) ; (3) monofenetre alti :
     bouton retour ⇅ (manquant) ; (4) butee ZMAX 18->16 (anti "page
     bleue" a zoom max) ; (5) bouton 🛰 vue SATELLITE (tuiles Esri
     World Imagery) sur smartphone ET laptop.
     v5.15.12 = grille dates alti 4 lignes (ouverture 6 s, poignee 7 s).
     v5.15.10 = la DATE ALTI SUIT la date PHOTO : changer la journee
     via le menu du haut passiverise l'ancienne date auto dans l'alti
     et active la nouvelle (selection = puces cochees a la main U
     date de la photo affichee) ; les puces cochees manuellement ne
     sont JAMAIS desactivees automatiquement.
     v5.15.9 = en 2F photo+ALTI, fenetre alti 60% de hauteur.
     v5.15.8 = poignee ⌄ des dates alti : affichage 4 s (2500 ms
     avant : trop court pour cocher plusieurs dates).
     v5.15.7 = temporisations 1 s (barre du haut ET puces dates de
     l'alti, rappel poignee = 2,5 s) ; poignee ⌄ AJOUTEE dans la
     fenetre altimetrie pour selectionner les dates ; poignee de la
     barre du haut DEPLACEE vers le haut de la PHOTO (avant : carte).
     v5.15.6 = barre flottante en 2F (normal + 3 fenetres), puces
     flottantes sur l'alti, photo conservee apres fermeture ✕.
     v5.15.5 = la PHOTO RESTE AFFICHEE en mode "3 fenetres".
     v5.15.4 = barre temporaire + bouton ✕ + alti 40%.
     v5.15.3 = MODE "3 FENETRES" (2F photo+carte + ⛰ de la carte) :
     photo masquee, barre du haut flottante translucide (survol
     temporaire par-dessus la carte), carte+alti occupent tout
     l'ecran, alti agrandie a 45% -> plus de troncature en bas.
     v5.15.2 = FIX : bouton ⧉ (retour 2 fenetres) visible en alti
     plein ecran 1F - c'etait le seul ecran d'ou l'on ne pouvait
     PAS revenir en double fenetre.
     v5.15.1 = FIX MOBILE : (1) altimetrie en OVERLAY sur la carte
     (2F photo+carte + ⛰) : puces de dates masquees -> le graphe
     n'est plus tronque en bas ; (2) bouton ⛰ de la pile reduit
     (40px) sur smartphone.
     v5.15 = VUES ALTIMETRIE MOBILES (bouton ⛰ dans l'entete) :
     - 1 fenetre : ⛰ = altimetrie PLEIN ECRAN (retour photo par ⇅)
     - 2 fenetres : ⛰ = bas de panneau passe de la CARTE a l'ALTI
       (et inversement) -> combos photo+carte / photo+alti ; la vue
     carte+alti reste accessible en 1F carte (⛰ de la pile zoom =
     overlay 35% comme avant).
     v5.14.2 = FIX curseur altimetrie : l'heure des photos (nom de
     fichier, heure locale) etait lue en UTC -> decalage +2h (ete) :
     curseur trop a droite en debut de journee, invisible sur les 2
     dernieres heures. Aussi : photo hors trace (avant allumage GPS /
     apres extinction) -> curseur aux bornes de la journee la plus
     proche, au lieu de disparaitre.
     v5.14.1 = FIX altimetrie : (1) journees mises bout a bout sur un
     axe virtuel -> les nuits ne creent plus d'espaces vides entre les
     courbes (separateur pointille discret entre journees) ; (2) le
     bouton ⛰ reste visible sur smartphone (zoom +/- toujours retires).
     v5.14 = ALTIMETRIE : bouton ⛰ (stack zoom) -> panneau bas de carte
     (~35%), multi-dates par puces, axe Y dynamique, curseur vertical
     a l'heure de la photo affichee, clic inverse profil -> photo.
     Donnees : profil.json genere par build_daily/gerer (v5.2.25).
     v5.13 = PORTRAIT PANORAMABLE : miniatures portraits non recadrees
     (etape1 v5.7, 600 x H), affichees pleine largeur dans le cadre fixe
     avec defilement vertical a la petite main (enablePan).
     v5.12 = FIX chevron DEFINITIF : le fond orange est sur .selbox (la
     boite), le select devient transparent dedans - le chevron est dans
     le bouton par construction, aucun rendu natif ne peut l'exiler
     (v5.10/v5.11 calaient le ▾ sur une boite dont le select natif
     divergeait legèrement selon navigateur/zoom). -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal vélo — Galerie</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,sans-serif;background:#0b0e13;color:#eee;overflow:hidden}
  #wrap{display:flex;height:100%;width:100%;position:relative}
  /* --- partie 1 : galerie (gauche) --- */
  #side{flex:0 0 var(--side-w,340px);background:#11151d;border-right:1px solid #39445c;display:flex;flex-direction:column;min-width:0}
  #side .sh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #26304a}
  #side .sh .t{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* poignee de redimensionnement galerie <-> carte (glisse lateral) */
  #split{flex:0 0 10px;cursor:col-resize;background:#1c2230;border-left:1px solid #39445c;border-right:1px solid #39445c;touch-action:none}
  #split:hover,#split.on{background:#ff7a00}
  #media{background:#000;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden}
  #media img,#media video{max-width:100%;max-height:100%;display:block}
  /* v5.13 : photo PORTRAIT - affichee PLEINE LARGEUR dans le cadre
     fixe (hauteur libre > cadre), defilement vertical a la petite main */
  #media img.tall{max-height:none;width:100%;height:auto;position:absolute;top:0;left:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none}
  #media img.tall.drag{cursor:grabbing}
  /* v5.13.1 : indice VISUEL de glissement (le cursor grab est invisible
     sur ecran tactile) - badge main + doubles fleches, pulse, disparait
     au premier glissement (classe .off) ou apres 5 s. */
  #panHint{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:22px;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:1;pointer-events:none;animation:panPulse 1.6s ease-in-out infinite;transition:opacity .4s}
  #panHint.off{opacity:0;animation:none}
  @keyframes panPulse{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-7px);opacity:.65}}
  #cap{padding:9px 12px;font-size:13px;color:#c8d2e0;border-top:1px solid #26304a}
  #cap .nm{font-weight:600;color:#eef2f8;margin-bottom:3px;word-wrap:break-word}
  #cap .dt{opacity:.75}
  /* commentaire mis en evidence : bloc distinct, plus grand, lisible */
  #cmt{display:none;margin-top:6px;padding:8px 11px;background:#1c2740;border-left:4px solid #ff7a00;border-radius:0 8px 8px 0;font-size:15.5px;line-height:1.45;color:#ffe9c9;word-wrap:break-word}
  #cmt.on{display:block}
  #cmt{max-height:5.2em;overflow-y:auto}   /* meme sur laptop : un long commentaire ne mange pas la photo */
  /* --- partie 2 : carte (droite) --- */
  #mapwrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0;overflow:hidden;background:#a9c6d8;cursor:grab;touch-action:none}
  #map.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;width:0;height:0}
  .tile{position:absolute;width:256px;height:256px;border:none}
  #traces{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .mk{position:absolute;transform:translate(-50%,-100%);cursor:pointer;line-height:0}
  .mk .icon{display:block;transition:transform .18s ease;transform-origin:50% 100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .mk.sel .icon{transform:scale(1.65);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #fff) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .mk.sel{z-index:500}
  /* --- contrôles --- */
  #zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:1000}
    #zoom button{width:52px;height:52px;font-size:26px;font-weight:700;border-radius:12px;border:2px solid #b35300;background:#ff7a00;color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  #zoom button:hover{background:#ffa040}
  #zoom button:active{background:#cc6200}
  /* v5.14 : bouton altimetrie (dans la pile #zoom) + panneau profil */
  #zoom button.on{background:#1f77e5;border-color:#123c6e}
  #profil{position:absolute;left:0;right:0;bottom:0;height:35%;background:#0d1117f2;border-top:2px solid #39445c;z-index:1002;display:none;flex-direction:column}
  #profil.on{display:flex}
  #prChips{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;flex:0 0 auto;scrollbar-width:thin}
  .prChip{padding:4px 10px;border-radius:14px;background:#1c2230;border:1px solid #45526b;color:#eee;font-size:12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .prChip.on{background:#ff7a00;border-color:#b35300;font-weight:700}
  #prWrap{flex:1;position:relative;margin:0 8px 8px}
  #prSvg{width:100%;height:100%;display:block}
  #bar{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:1000}
  #bar button{padding:9px 13px;border-radius:9px;border:1px solid #45526b;background:#1c2230ee;color:#eee;font-size:14px;cursor:pointer;backdrop-filter:blur(4px)}
  #bar button:hover{background:#2a3245}
  #bar button.on{background:#2d6a4f;border-color:#40916c}
  #bar a{padding:16px 24px;border-radius:12px;border:2px solid #2f6db3;background:#1b3a63ee;color:#fff;font-size:20px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(4px);box-shadow:0 3px 8px rgba(0,0,0,.45)}
  #bar a:hover{background:#255089}
  .nav{flex:0 0 64px;height:56px;font-size:28px;font-weight:700;background:#ff7a00;border:2px solid #b35300;color:#fff;cursor:pointer;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
  .nav:hover{background:#ffa040}
  .nav:active{background:#cc6200}
  /* menu deroulant Date : depuis v5.12, le VISUEL (orange, bordure,
     arrondi, ombre) est sur .selbox et le select est TRANSPARENT dedans.
     Le chevron est dans la boite orange PAR CONSTRUCTION : aucun rendu
     natif du select (bordures, metriques Android) ne peut l'exiler. */
  .selwrap{display:flex;flex:1 1 auto;min-width:0;justify-content:center}
  .selbox{position:relative;display:inline-flex;flex:0 0 auto;width:128px;height:56px;background:#ff7a00;border:2px solid #b35300;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
  .selbox:hover{background:#ffa040}
  select.nav{flex:1;min-width:0;height:100%;background:transparent;border:none;font-size:16px;font-weight:700;color:#fff;cursor:pointer;text-align:center;text-align-last:center;padding:0 24px 0 6px;-webkit-appearance:none;appearance:none}
  .selArrow{position:absolute;right:7px;top:50%;transform:translateY(-50%);pointer-events:none;color:#fff;font-size:15px;font-weight:700;line-height:1}
  select.nav option{background:#1c2230;color:#eee;font-weight:400}
  /* zone admin (visible uniquement en mode #adm=) : saisie commentaire */
  #admBox{padding:8px 12px;border-top:1px solid #26304a;display:none;flex-direction:column;gap:6px}
  #admBox.on{display:flex}
  /* =========== ADAPTATION SMARTPHONE ===========
     REGLE D'OR : cette section est en FIN de feuille car, a specificite
     egale, la DERNIERE regle du source gagne - placee avant les regles
     de base (#zoom, select.nav, #bar a...), elle etait systematiquement
     ecrasee (bug v5.3 : zoom visibles, boutons hdFlip masques sur S8). */
  /* bases "cachees par defaut" (laptop) : AVANT les media queries */
  #hdFlip,#hdLayout,#hdAlti{display:none}
  #btFlip{display:none}
  #btLayoutM{display:none}
  /* monofenetre (ecran tres etroit) : photo OU carte, bascule glisse/bouton */
  #wrap.single{flex-direction:column}
  #wrap.single #split{display:none}
  #wrap.single #side{--side-w:100%}
  #wrap.single:not(.showmap) #mapwrap{display:none}
  #wrap.single.showmap #side{display:none}
  #wrap.single.showmap #mapwrap{flex:1}
  #wrap.single.showmap #btFlip{display:flex;position:absolute;left:10px;bottom:14px;z-index:1001;width:46px;height:46px;border-radius:12px;border:2px solid #b35300;background:#ff7a00cc;color:#fff;font-size:22px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
  /* v5.16 : meme bouton retour ⇅ en MONOFENETRE ALTIMETRIE (il manquait
     - seul ecran sans retour vers la photo) */
  #wrap.single.showprofil #btFlip{display:flex;position:absolute;left:10px;bottom:14px;z-index:1001;width:46px;height:46px;border-radius:12px;border:2px solid #b35300;background:#ff7a00cc;color:#fff;font-size:22px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
  #wrap.single.showmap #btFlip:hover{background:#ffa040}
  /* v5.15 : ALTI PLEIN ECRAN en 1F (bouton ⛰ de l'entete photo) -
     le panneau #profil (dans #mapwrap) remplace TOUT : map masquee */
  #wrap.single.showprofil #side{display:none}
  #wrap.single.showprofil #mapwrap{display:block;flex:1}
  #wrap.single.showprofil #map{display:none}
  #wrap.single.showprofil #zoom,#wrap.single.showprofil #bar{display:none}
  /* v5.15.2 : le bouton ⧉ (retour 2 fenetres) doit rester VISIBLE en
     alti plein ecran - c'est le seul moyen d'en sortir sans repasser
     par la photo (btLayoutM est masque via #zoom/#bar mais il est
     PILE-EXTERIEUR : on le reaffiche ici, en bas de l'ecran) */
  #wrap.single.showprofil #btLayoutM{display:flex;z-index:1600}   /* v5.16.1 : AU-DESSUS du panneau #profil (z-index 1002) */
  #wrap.single.showprofil #profil{display:flex;position:relative;height:100%;border-top:none}
  #wrap.single.showprofil #btFlip{display:flex;position:absolute;left:10px;bottom:14px;z-index:1600;width:46px;height:46px;border-radius:12px;border:2px solid #b35300;background:#ff7a00cc;color:#fff;font-size:22px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
  #wrap.single.showprofil #btFlip:hover{background:#ffa040}
  /* v5.15 : en 2F, bas de panneau = ALTIMETRIE (carte masquee, profil
     a pleine hauteur du bas de panneau) -> combo photo + altimetrie */
  #wrap.alti #map{display:none}
  #wrap.alti #zoom,#wrap.alti #bar,#wrap.alti #btLayoutM{display:none}
  #wrap.alti #profil{display:flex;position:relative;height:auto;flex:1;border-top:none}
  /* empilement portrait : galerie au-dessus (55%), carte dessous */
  @media (orientation: portrait) and (max-width:820px){
    #wrap{flex-direction:column}
    #side{--side-w:55%}
    /* v5.15.9 : en 2F PHOTO+ALTI (.alti), le bas d'ecran etant inutilise
       (pas de carte), la fenetre alti gagne ~1/3 de hauteur : la part du
       bas passe de 45% a 60% au lieu des 45% de la carte */
    #wrap.alti #side{--side-w:40%}
    #split{flex:0 0 10px;cursor:row-resize;border-left:none;border-right:none;border-top:1px solid #39445c;border-bottom:1px solid #39445c}
  }
  @media (max-width:820px){
    /* gestes > boutons : fleches et zoom retires sur smartphone */
    #prev,#next{display:none}
    /* v5.14.1 : le bouton altimetrie ⛰ reste accessible sur smartphone
       (les zoom +/- restent retires : gestes tactiles) */
    #zoom{display:flex}
    #zoom #zin,#zoom #zout{display:none}
    /* v5.15.1 : bouton ⛰ de la pile plus discret sur smartphone, et
       puces de DATES masquees quand l'altimetrie est en OVERLAY sur la
       carte (2F photo+carte + ⛰) : le panneau ~35% etant petit, les
       puces tronquaient le bas du graphe. La puce par defaut reste la
       date du media affiche ; les autres dates restent accessibles via
       les vues alti pleine hauteur (2F .alti ou 1F plein ecran). */
    #zoom #btProfil,#zoom #btSat{width:40px;height:40px;font-size:19px}
    #wrap:not(.alti):not(.showprofil) #profil.on #prChips{padding-top:6px}
    /* v5.15.3 : cas "3 fenetres" (2F photo+carte + ⛰ overlay) : photo
       masquee, barre du haut FLOTTANTE translucide par-dessus la carte,
       carte+alti occupent tout l'ecran -> l'altimetrie (45%) n'est plus
       tronquee. Retour a la normale en refermant l'alti. */
    #shHandle{display:none}
    /* v5.15.6 : en 2 FENETRES (mode normal OU "3 fenetres" p3), la
       barre du haut est TOUJOURS flottante et temporaire (0,5 s par
       defaut) par-dessus la photo : le media monte d'autant, la
       hauteur photo+carte est optimisee. Poignee ⌄ pour la rappeler. */
    #wrap:not(.single) #side .sh{position:absolute;top:0;left:0;right:0;z-index:1500;background:#11151dcc;backdrop-filter:blur(4px);border-bottom:1px solid #39445c;opacity:0;pointer-events:none;transition:opacity .3s}
    #wrap:not(.single) #side .sh.show{opacity:1;pointer-events:auto}
    /* v5.15.7 : poignee ⌄ des DATES de l'alti - meme principe que
       celle de la barre du haut (visible quand les puces sont
       cachees, rappel 2,5 s par clic) */
    #prHandle{display:none}
    #profil.on:not(.chipsbar) #prHandle{display:flex}
    /* v5.15.7 : poignee ⌄ de la barre du haut, positionnee au-dessus
       de la PHOTO (avant : haut de la carte) - c'est la que l'oeil
       cherche la navigation */
    #side{position:relative}
    #wrap:not(.single):not(.baron) #shHandle{display:flex}
    /* v5.15.6 : puces de DATES de l'alti = aussi FLOTTANTES (par-dessus
       le haut du graphe, 0,5 s a chaque changement de photo) - le
       graphe garde toute sa hauteur, plus de troncature */
    /* v5.15.12 : puces en GRILLE 4 LIGNES x colonnes de 4 dates
       (glissement horizontal = colonnes suivantes) */
    #profil.on #prChips{position:absolute;top:0;left:0;right:0;z-index:5;background:#0d1117f2;opacity:0;pointer-events:none;transition:opacity .25s;display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);grid-auto-columns:max-content;align-content:start;gap:4px;padding:8px;overflow-x:auto;max-height:148px}
    #profil.on #prChips.show{opacity:1;pointer-events:auto}
    /* bouton FERMER l'alti (en haut a droite de l'alti) */
    #prClose{display:none}
    #wrap.p3 #prClose{display:flex;position:absolute;top:6px;right:8px;z-index:1600;width:36px;height:36px;border-radius:10px;border:2px solid #b35300;background:#ff7a00;color:#fff;font-size:17px;font-weight:700;align-items:center;justify-content:center;cursor:pointer}
    #wrap.p3 #profil{height:40%}
    /* v5.16 : en mode "3 fenetres" uniquement, marqueurs REDUITS d'1/3
       (moins intrusifs ; le marqueur selectionne reste agrandi mais
       reste plus petit qu'en 2F). Le 2F photo+carte est INCHANGE. */
    #wrap.p3 .mk .icon{transform:scale(.67)}
    #wrap.p3 .mk.sel .icon{transform:scale(1.1)}
    /* styles communs des poignees ⌄ (barre du haut, puces alti) */
    #shHandle,#prHandle{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:1501;height:26px;padding:0 14px;border-radius:0 0 10px 10px;border:1px solid #b35300;border-top:none;background:#ff7a00cc;color:#fff;font-size:14px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
    /* l'URL/nom de fichier n'apporte rien sur mobile : date deja dans
       le menu, le commentaire reste (bloc #cmt) */
    #cap .nm,#cap .dt{display:none}
    .selbox{width:124px;height:40px}
    select.nav{font-size:12.5px;padding-right:22px}
    .selArrow{right:6px;font-size:13px}
    #bar a{padding:7px 9px;font-size:12px;border-width:1px;box-shadow:0 2px 5px rgba(0,0,0,.4)}
    #cap{font-size:12px}
    #cmt{font-size:13.5px;max-height:3.4em}
    #admBox button{height:38px;font-size:14px}
    /* boutons d'entete photo (mobile seulement) : bascule carte + layout */
    #hdFlip,#hdLayout{display:flex;flex:0 0 40px;height:40px;font-size:17px;align-items:center;justify-content:center}
    /* v5.15 : bouton ALTIMETRIE dans l'entete - present en 1F (photo ->
       alti plein ecran) ET en 2F (bas de panneau carte -> alti) */
    #hdAlti{display:flex;flex:0 0 40px;height:40px;font-size:17px;align-items:center;justify-content:center;background:#1c2230}
    #hdAlti.on{background:#1f77e5}
    /* v5.13.2 : en mode 2 FENETRES (non .single), le bouton carte (hdFlip)
       est INUTILE - showmap n'agit qu'en monofenetre (bug constate : il
       ne faisait RIEN en 2 fenetres) : on le MASQUE. Il revient en
       monofenetre, ou il bascule galerie -> carte. */
    #wrap:not(.single) #hdFlip{display:none}
    /* v5.13.3 : idem pour le bouton layout de la carte (btLayoutM) :
       en 2 FENETRES il duplique le hdLayout de l'entete (toujours
       visible) -> masque. En MONOFENETRE carte (.single.showmap),
       l'entete est masque : btLayoutM reste le SEUL moyen de
       revenir a la vue 2 fenetres -> affiche. */
    #wrap:not(.single) #btLayoutM{display:none}
    /* bouton layout 2-fenetres, sur la carte (mobile seulement) */
    #btLayoutM{display:flex;position:absolute;left:64px;bottom:14px;z-index:1001;width:46px;height:46px;border-radius:12px;border:2px solid #b35300;background:#ff7a00cc;color:#fff;font-size:18px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
    #btLayoutM:hover{background:#ffa040}
  }
  #admBox textarea{background:#0d1117;color:#eee;border:1px solid #45526b;border-radius:8px;padding:8px;font-family:inherit;font-size:13px;resize:vertical;min-height:44px}
  #admBox button{align-self:flex-end;height:42px;font-size:16px}
  #cnt{font-size:12px;opacity:.7;padding:0 4px;margin-left:auto}   /* margin auto : pousse le compteur et '>' vers le bord droit */
  #err{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#5c1a1a;border:1px solid #a33;color:#fff;padding:10px 16px;border-radius:10px;z-index:2000;display:none;font-size:14px}
</style>
</head>
<body>

<script>
"use strict";
// --- Seule ligne a adapter : l'URL GitHub Pages du projet ---
const BASE = "https://gurtsepaqrt87.github.io/gkr63x-g84zwo";
// --- 2e ligne a adapter (mode admin) : le depot GitHub "user/projet".
// NB : non deduisible de BASE (sur user.github.io/projet, l'user est
// dans le sous-domaine, pas dans le chemin) - d'ou cette constante.
const REPO = "gurtsepaqrt87/gkr63x-g84zwo";

const mapEl = document.getElementById("map");
const world = document.getElementById("world");
const side = document.getElementById("side");
const mediaEl = document.getElementById("media");
const capTxt = document.getElementById("capTxt");
const capDate = document.getElementById("capDate");
const cntEl = document.getElementById("cnt");
const errEl = document.getElementById("err");

let zoom = 11, clon = -1.85, clat = 48.15;   // centre initial (cadrage auto ensuite)
let ox = 0, oy = 0;
let media = [], marks = [], traces = [];
let sel = -1, userResized = false;   // userResized : l'utilisateur a glisse la poignee -> plus d'ajustement auto
const ZMIN = 3, ZMAX = 16;   // v5.16 : ZMAX 18->16, butee anti "page
                             // bleue" (au-dela de 16, tuiles vides/ocean)
// ---------- contexte d'affichage : laptop OU smartphone ----------
// "pointer:coarse" = doigt (pas souris) ; petit ecran en plus = mobile.
// Sert a desactiver l'ajustement auto de largeur (sans objet en portrait)
// et a afficher l'aide gestuelle. La bascule horizontal/vertical est
// geree par les media queries CSS (layout) + le resize (rendu carte).
const MOBILE = matchMedia("(pointer: coarse)").matches || innerWidth < 820;
// galerie <= 2/3 de l'axe disponible (largeur en paysage, hauteur en portrait)
function SIDEMAX() {
  const col = getComputedStyle(document.getElementById("wrap"))
    .flexDirection.includes("column");
  return Math.floor((col ? innerHeight : innerWidth) * 2 / 3);
}
function setSideW(px) {
  // Largeur MINIMALE de la fenetre photos : l'en-tete doit toujours tenir
  // (‹ 64 + date 128 + compteur ~50 + › 64 + marges ~30 ≈ 340 px). Sans
  // ce plancher, une video basse resolution en portrait (ex. celle du
  // 28/09) reduisait la fenetre sous cette valeur -> bouton date ampute.
  const SIDEMIN = 348;
  side.style.setProperty("--side-w", Math.max(SIDEMIN, Math.min(SIDEMAX(), px)) + "px");
}

// ---------- projection ----------
const scale = z => 256 * Math.pow(2, z);
const lon2x = (lon, z) => (lon + 180) / 360 * scale(z);
const lat2y = (lat, z) => {
  const s = Math.sin(lat * Math.PI / 180);
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * scale(z);
};
function px2lon(px) { return px / scale(zoom) * 360 - 180; }
function py2lat(py) {
  const n = Math.PI - 2 * Math.PI * py / scale(zoom);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

// ---------- tuiles ----------
const tiles = new Map();
let sat = false;   // v5.16 : vue satellite (tuiles Esri World Imagery)
function setSat(v) {
  sat = v;
  document.getElementById("btSat").classList.toggle("on", sat);
  tiles.forEach(img => img.remove());   // vider le cache : autres tuiles
  tiles.clear();
  render();
}
function renderTiles() {
  const W = mapEl.clientWidth, H = mapEl.clientHeight;
  const x0 = Math.floor(ox / 256), y0 = Math.floor(oy / 256);
  const x1 = Math.floor((ox + W) / 256), y1 = Math.floor((oy + H) / 256);
  const max = scale(zoom) / 256;
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    if (y < 0 || y >= max) continue;
    const wx = ((x % max) + max) % max;
    const key = zoom + "/" + wx + "/" + y;
    if (tiles.has(key)) continue;
    const img = document.createElement("img");
    img.className = "tile";
    // v5.16 : OSM (plan) ou Esri World Imagery (satellite) - Esri :
    // /tile/{z}/{y}/{x} (y AVANT x, contrairement a OSM)
    if (sat) {
      const p = key.split("/");
      img.src = "https://server.arcgisonline.com/ArcGIS/rest/services/"
              + "World_Imagery/MapServer/tile/" + p[0] + "/" + p[2] + "/" + p[1];
    } else {
      img.src = "https://tile.openstreetmap.org/" + key + ".png";
    }
    img.style.left = (x * 256) + "px";
    img.style.top = (y * 256) + "px";
    img.draggable = false;
    world.appendChild(img);
    tiles.set(key, img);
  }
}

// ---------- traces ----------
let svg = null;
function renderTraces() {
  if (svg) { svg.remove(); svg = null; }
  if (!traces.length) return;
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.id = "traces";
  for (const t of traces) {
    if (t.geometry.coordinates.length < 2) continue;
    const pts = t.geometry.coordinates
      .map(c => lon2x(c[0], zoom) + "," + lat2y(c[1], zoom))
      .join(" ");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    p.setAttribute("points", pts);
    const o = t.properties._umap_options || {};
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", o.color || "#3388ff");
    p.setAttribute("stroke-width", o.weight || 4);
    p.setAttribute("stroke-opacity", o.opacity || 0.8);
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    svg.appendChild(p);
  }
  world.appendChild(svg);
}

// ---------- marqueurs ----------
function pinSVG(color) {
  return '<svg class="icon" width="22" height="32" viewBox="0 0 26 38">' +
    '<path d="M13 0C5.8 0 0 5.8 0 13c0 9.2 13 25 13 25s13-15.8 13-25C26 5.8 20.2 0 13 0z" fill="' + color + '" stroke="#fff" stroke-width="1.5"/>' +
    '<circle cx="13" cy="13" r="4.4" fill="#fff"/></svg>';
}
function circleSVG(color) {
  return '<svg class="icon" width="38" height="38" viewBox="0 0 26 26">' +
    '<circle cx="13" cy="13" r="9.5" fill="' + color + '" stroke="#fff" stroke-width="2.5"/>' +
    '<path d="M13 7l4.5 8h-9z" fill="#fff"/></svg>';
}
function renderMarkers() {
  marks.forEach(m => m.el.remove()); marks = [];
  for (const m of media) {
    const el = document.createElement("div");
    el.className = "mk";
    el.innerHTML = m.type === "video" ? circleSVG(m.color) : pinSVG(m.color);
    el.title = m.name + " — " + m.date;
    el.style.left = lon2x(m.lon, zoom) + "px";
    el.style.top = lat2y(m.lat, zoom) + "px";
    el.addEventListener("click", e => {
      e.stopPropagation();
      // ignorer le clic residuel d'un deplacement qui a commence sur le marqueur
      if (Date.now() - lastDrag < 400) return;
      openGal(m.i);
    });
    world.appendChild(el);
    marks.push({ el, i: m.i });
  }
  applySel();
}
function applySel() {
  marks.forEach(m => m.el.classList.toggle("sel", m.i === sel));
}

// ---------- rendu ----------
function render() {
  // v5.16.4 : quand le panneau alti RECOUVRE le bas de la carte (3F,
  // 1F carte+alti, ou overlay laptop), centrer dans la zone VISIBLE
  // au-dessus du panneau - sinon le pointeur actif est centre dans le
  // conteneur ENTIER et parait decale vers le bas ("comme en 2F").
  let profH = 0;
  // v5.16.5 : test DOM (pas la variable profilOn, declaree PLUS BAS
  // dans le script : render() est appele AVANT sa declaration a
  // l'initialisation -> ReferenceError TDZ qui tuait TOUTE la page :
  // ni photos ni tuiles, seuls les boutons restaient)
  const panP = document.getElementById("profil");
  if (panP && panP.classList.contains("on")
      && !wrapEl.classList.contains("alti")
      && !wrapEl.classList.contains("showprofil"))
    profH = panP.offsetHeight || 0;
  ox = lon2x(clon, zoom) - mapEl.clientWidth / 2;
  oy = lat2y(clat, zoom) - (mapEl.clientHeight - profH) / 2;
  world.style.transform = "translate(" + (-ox) + "px," + (-oy) + "px)";
  renderTiles(); renderTraces(); renderMarkers();
}
// v5.16 : recentrer la carte sur le MARQUEUR de la photo affichee
// (appele a l'entree en mode "3 fenetres" et a chaque photo en 3F)
function centerActive() {
  const m = media[sel];
  if (!m || m.lat == null) return;
  clon = m.lon; clat = m.lat;
  render();
}

// ---------- interactions carte ----------
let drag = null;
// pincé (pinch) : 2 doigts -> zoom. On suit tous les pointeurs actifs.
const pts = new Map();
let pinch = null;
function pinchDist() {
  const a = [...pts.values()];
  return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
}
mapEl.addEventListener("pointerdown", e => {
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) {   // passage en mode pincé : abandonner le drag
    drag = null;
    pinch = { d0: pinchDist(), z0: zoom };
    mapEl.classList.remove("drag");
    return;
  }
  drag = { x: e.clientX, y: e.clientY, clon, clat, moved: false };
  mapEl.classList.add("drag"); mapEl.setPointerCapture(e.pointerId);
});
mapEl.addEventListener("pointermove", e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size >= 2) {
    // pincé : ratio de distance -> niveaux de zoom (1 niveau par ~25 %)
    const d = pinchDist();
    let z = pinch.z0 + Math.round(Math.log2(d / pinch.d0) * 2.5);
    z = Math.max(ZMIN, Math.min(ZMAX, z));
    if (z !== zoom) { zoom = z; render(); }
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  // sens Google Maps : on SAISIT la carte - elle suit le pointeur.
  // glisse gauche => le contenu va a gauche => la zone visible part vers l'EST.
  world.style.transform = "translate(" + (-ox + dx) + "px," + (-oy + dy) + "px)";
});
function endPointer(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const wasMoved = drag.moved;   // v5.13.4 : hit-test marqueur si non-drag
  if (drag.moved) {
    // glisse gauche (dx<0) => centre deplace de -dx => vers l'EST.
    // glisse bas (dy>0) => centre deplace de -dy => vers le NORD.
    const px = lon2x(drag.clon, zoom) - dx;
    const py = lat2y(drag.clat, zoom) - dy;
    clon = px2lon(px); clat = py2lat(py);
    lastDrag = Date.now();
    render();
  }
  drag = null; mapEl.classList.remove("drag");
  // v5.13.4 : CLIC MARQUEUR EN MODE LAPTOP. Le pointerdown fait
  // setPointerCapture(mapEl) : le navigateur redirige alors le clic
  // vers la CAPTUREE (la carte), jamais vers le marqueur - le handler
  // click des marqueurs ne se declenchait donc PAS a la souris (ca
  // marchait au doigt : le click synthetique tactile vise l'element
  // d'origine). Parade : hit-test au pointerup - si le pointeur n'a
  // PAS bouge (pas un drag) et lache sur un marqueur, on ouvre la
  // galerie sur ce media. Le handler click reste pour les navigateurs
  // ou il marche (double appel inoffensif : openGal est idempotent).
  if (!wasMoved) {
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const mk = hit && hit.closest ? hit.closest(".mk") : null;
    if (mk) {
      const found = marks.find(m => m.el === mk);
      if (found) openGal(found.i);
    }
  }
}
mapEl.addEventListener("pointerup", endPointer);
mapEl.addEventListener("pointercancel", endPointer);
let lastDrag = 0;
mapEl.addEventListener("dblclick", () => { if (zoom < ZMAX) { zoom++; render(); } });
// zoom molette : centre sur le point du curseur (sens Google Maps :
// molette haut = zoom in, molette bas = zoom out)
mapEl.addEventListener("wheel", e => {
  e.preventDefault();
  const dir = e.deltaY < 0 ? 1 : -1;
  if ((dir > 0 && zoom >= ZMAX) || (dir < 0 && zoom <= ZMIN)) return;
  // garder le point sous le curseur fixe : coordonnees avant/apres
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const px = ox + mx, py = oy + my;         // position monde du curseur
  clon = px2lon(px); clat = py2lat(py);     // centre provisoire = curseur
  zoom += dir;
  render();
  // recentrer pour que le point curseur reste a l'ecran ou il etait :
  const px2 = lon2x(clon, zoom), py2 = lat2y(clat, zoom);
  const newOx = px2 - mx, newOy = py2 - my; // origine monde desiree
  // centre final correspondant a cette origine :
  clon = px2lon(newOx + mapEl.clientWidth / 2);
  clat = py2lat(newOy + mapEl.clientHeight / 2);
  render();
}, { passive: false });
document.getElementById("zin").onclick = () => { if (zoom < ZMAX) { zoom++; render(); } };
document.getElementById("zout").onclick = () => { if (zoom > ZMIN) { zoom--; render(); } };

// ---------- galerie ----------
// v5.8 : largeur de fenetre FIXE. Les photos publiees font RESIZE
// (config.sh, ex. 600x450) : la fenetre prend la largeur PAYSAGE des
// photos (600), cappee a 2/3 de l'ecran et au plancher de l'en-tete.
// Les videos ne redimensionnent plus rien : le bouton > reste immobile.
// Si vous changez RESIZE dans config.sh, ajustez la constante en dessous.
const PHOTO_W = 600;   // = largeur paysage definie par RESIZE dans config.sh
function fitSideToMedia(el, isVideo) {
  if (userResized || MOBILE) return;
  setSideW(PHOTO_W);   // setSideW applique plafond 2/3 ecran + plancher 348
  render();
}
// v5.13 : photo PORTRAIT - defilement vertical dans le cadre fixe.
// La miniature portrait fait 600 x H (H libre, ex. 800) : affichee
// pleine largeur, elle depasse le cadre -> glissement vertical borne
// (0 en haut, cadre-image en bas), petite main (cursor grab), depart
// CENTRE. Pointeur souris ET doigt (pointer events + setPointerCapture).
// v5.13.1 : badge d'invitation au glissement - le curseur grab est
// invisible sur Android ; ce badge visible pulse jusqu'au 1er glissement.
function enablePan(el) {
  el.classList.add("tall");
  const box = mediaEl;
  let top = 0, y0 = null, hint = null, hintTimer = null;
  function offHint() {
    if (hint) { hint.classList.add("off"); hint = null; }
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  }
  requestAnimationFrame(() => {
    const max = Math.min(0, box.clientHeight - el.offsetHeight);
    if (max === 0) { el.classList.remove("tall"); return; } // tient entier
    top = max / 2; el.style.top = top + "px";               // centre
    hint = document.createElement("div");
    hint.id = "panHint";
    hint.textContent = "⇕";
    hint.insertAdjacentHTML("beforeend", "<span style='font-size:15px;font-weight:700'>glisser</span>");
    box.appendChild(hint);
    hintTimer = setTimeout(offHint, 5000);   // lache apres 5 s sans glissement
  });
  el.addEventListener("pointerdown", e => {
    offHint();
    const max = Math.min(0, box.clientHeight - el.offsetHeight);
    if (max === 0) return;
    y0 = e.clientY - top; el.classList.add("drag");
    el.setPointerCapture(e.pointerId); e.preventDefault();
  });
  el.addEventListener("pointermove", e => {
    if (y0 === null) return;
    const max = Math.min(0, box.clientHeight - el.offsetHeight);
    top = Math.max(max, Math.min(0, e.clientY - y0));
    el.style.top = top + "px";
  });
  const fin = () => { y0 = null; el.classList.remove("drag"); };
  el.addEventListener("pointerup", fin);
  el.addEventListener("pointercancel", fin);
}

function openGal(i) {
  if (!media.length) return;
  sel = Math.max(0, Math.min(media.length - 1, i));
  const m = media[sel];
  mediaEl.innerHTML = "";
  let el;
  if (m.type === "video") {
    el = document.createElement("video");
    // "#t=0.1" : fragment media - le navigateur affiche l'image de la
    // video a 0,1 s en vignette (poster) au lieu du fond gris par defaut
    el.src = m.url + "#t=0.1"; el.controls = true; el.playsInline = true;
    el.preload = "metadata";
    fitSideToMedia(el, true);
  } else {
    el = document.createElement("img");
    el.src = m.url; el.alt = "";
    // v5.13 : portrait -> defilement vertical dans le cadre fixe
    el.addEventListener("load", () => { if (el.naturalHeight > el.naturalWidth) enablePan(el); });
    fitSideToMedia(el, false);
  }
  mediaEl.appendChild(el);
  capTxt.textContent = m.name;
  capDate.textContent = m.date;
  const cmtEl = document.getElementById("cmt");
  cmtEl.textContent = m.commentaire || "";
  cmtEl.classList.toggle("on", !!m.commentaire);
  cntEl.textContent = (sel + 1) + " / " + media.length;
  // zone admin : pre-remplir le champ commentaire si mode admin
  if (ADM) { document.getElementById("admTxt").value = m.commentaire || ""; }
  // le menu Date suit le media affiche
  if (profilOn) { syncPrDates(); drawProfil();
                 if (wrapEl.classList.contains("p3")) centerActive(); } // v5.16 : recentrage en 3F
  barFlash();                                    // v5.15.6 : barre flottante
  const dSel = document.getElementById("btDate");
  if (dSel.value !== m.date) dSel.value = m.date;
  applySel();
  clon = m.lon; clat = m.lat;
  render();   // recentrage uniquement a l'affichage d'un media
}
// ---------- commentaires (source : photos.csv, lu directement) ----------
// Les commentaires vivent dans photos.csv (publie chaque soir) : la page
// les lit a la volee, ils s'affichent donc pour tout le monde SANS attendre
// la regeneration des geojson. Le champ url du CSV fait la correspondance.
let cmtByUrl = {};
function parseCSVLine(line) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ",") { out.push(cur); cur = ""; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}
async function loadComments() {
  try {
    const r = await fetch(BASE + "/photos.csv?v=" + Date.now());
    if (!r.ok) return;
    const lines = (await r.text()).split(/\r?\n/).filter(Boolean);
    const head = parseCSVLine(lines[0]);
    const iDate = head.indexOf("date"), iNom = head.indexOf("nom"),
          iUrl = head.indexOf("url"), iCmt = head.indexOf("commentaire");
    if (iUrl < 0 || iCmt < 0) return;
    for (const l of lines.slice(1)) {
      const f = parseCSVLine(l);
      if (f.length >= head.length && f[iCmt]) cmtByUrl[f[iUrl]] = f[iCmt];
    }
    // appliquer aux medias deja charges et rafraichir l'affichage
    let changed = false;
    for (const m of media) {
      const c = cmtByUrl[m.url];

    }
    if (changed && sel >= 0) {

      c.textContent = media[sel].commentaire || "";
      c.classList.toggle("on", !!media[sel].commentaire);
    }

// ---------- mode ADMIN : #adm=<token> dans l'URL ----------
// Le token (PAT GitHub a portee depot, Contents read+write) ne figure QUE
// dans l'URL de votre navigateur (jamais dans le fichier partage) :
// famille/amis n'ont pas de #adm= -> pas de zone de saisie.
const ADM = location.hash.startsWith("#adm=") ? location.hash.slice(5) : null;

document.getElementById("admSave").onclick = async () => {
  const btn = document.getElementById("admSave"), m = media[sel];
  if (!m) return;
  if (!ADM || !REPO) {   // diagnostiquer au lieu de quitter silencieusement
    btn.textContent = "✖ Mode admin indisponible (token ou REPO manquant)";
    setTimeout(() => btn.textContent = "💾 Enregistrer", 4000);
    return;
  }
  const txt = document.getElementById("admTxt").value.trim();
  btn.textContent = "…";
  try {
    // 1. relire le CSV courant via l'API (donne aussi le sha du fichier)
    const g = await fetch("https://api.github.com/repos/" + REPO + "/contents/photos.csv",
                          { headers: { Authorization: "Bearer " + ADM, Accept: "application/vnd.github+json" } });
    if (!g.ok) throw new Error("lecture CSV : HTTP " + g.status);
    const meta = await g.json();
    const lines = new TextDecoder().decode(
      Uint8Array.from(atob(meta.content.replace(/\n/g, "")), c => c.charCodeAt(0)))
      .split(/\r?\n/).filter(Boolean);
    // 2. mettre a jour la ligne du media (cle : url)
    const head = parseCSVLine(lines[0]);
    const iUrl = head.indexOf("url"), iCmt = head.indexOf("commentaire");
    let hit = false;
    for (let i = 1; i < lines.length; i++) {
      const f = parseCSVLine(lines[i]);
      if (f[iUrl] === m.url) {
        // re-encoder la ligne avec le commentaire cite s'il contient virgules/quotes
        f[iCmt] = txt; hit = true;
        lines[i] = f.map(x => /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x).join(",");
      }
    }
    if (!hit) throw new Error("ligne introuvable dans photos.csv");
    // 3. commit via l'API (seul photos.csv est republie - pas les medias)
    const body = lines.join("\n") + "\n";
    const b64 = btoa(String.fromCharCode(...new TextEncoder().encode(body)));
    const p = await fetch("https://api.github.com/repos/" + REPO + "/contents/photos.csv", {
      method: "PUT",
      headers: { Authorization: "Bearer " + ADM, Accept: "application/vnd.github+json" },
      body: JSON.stringify({
        message: "commentaire " + m.name + " (" + m.date + ")",
        content: b64, sha: meta.sha })
    });
    if (!p.ok) throw new Error("commit : HTTP " + p.status);
    m.commentaire = txt; cmtByUrl[m.url] = txt;
    const c = document.getElementById("cmt");
    c.textContent = txt; c.classList.toggle("on", !!txt);
    btn.textContent = "✔ Enregistré";
  } catch (e) { btn.textContent = "✖ Erreur : " + e.message; }
  setTimeout(() => btn.textContent = "💾 Enregistrer", 3000);
};

function photoEpoch(m) {

function prColor(date) {
  const m = media.find(x => x.date === date && x.color);
  return m ? m.color : "#1f77e5";

function drawProfil() {
  document.querySelectorAll(".prChip").forEach(c =>
    c.classList.toggle("on", prDates.has(c.textContent)));
  const svg = document.getElementById("prSvg");
  const W = svg.clientWidth || 320, H = svg.clientHeight || 100;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.innerHTML = ""; prMap = null;
  if (!profilData || !prDates.size) return;
  // v5.14.1 : journees mises BOUT A BOUT sur un axe virtuel -> les
  // nuits ne creent plus d'espaces vides ; chaque journee occupe une
  // largeur proportionnelle a sa duree reellement tracee.
  const blocks = [...prDates].sort().map(d => {
    const a = (profilData.dates[d] || []).map(([t, e]) => [t * 1000, e]);
    a.sort((x, y) => x[0] - y[0]);
    return { d: d, pts: a };
  }).filter(b => b.pts.length);
  if (!blocks.length) return;
  let npts = 0, off = 0;
  for (const b of blocks) {
    b.t0 = b.pts[0][0]; b.t1 = b.pts[b.pts.length - 1][0];
    b.dur = Math.max(1, b.t1 - b.t0); b.off = off; off += b.dur;
    npts += b.pts.length;
  }
  const Vtot = off || 1;
  if (npts < 2) return;
  let emin = Infinity, emax = -Infinity;
  for (const b of blocks) for (const p of b.pts) {
    if (p[1] < emin) emin = p[1]; if (p[1] > emax) emax = p[1];
  }
  const mg = Math.max(10, (emax - emin) * 0.15);
  emin -= mg; emax += mg;
  const X = t => {
    for (const b of blocks)
      if (t >= b.t0 && t <= b.t1)
        return 42 + (b.off + (t - b.t0)) / Vtot * (W - 54);
    return null;                          // hors journees selectionnees
  };
  const Y = e => H - 16 - (e - emin) / (emax - emin) * (H - 28);
  prMap = { blocks: blocks, Vtot: Vtot, X: X, Y: Y, emin: emin, emax: emax, W: W };
  for (let i = 0; i <= 4; i++) {          // grille horizontale + cotes
    const e = emin + (emax - emin) * i / 4;
    const ln = document.createElementNS(NSVG, "line");
    ln.setAttribute("x1", 42); ln.setAttribute("x2", W - 12);
    ln.setAttribute("y1", Y(e)); ln.setAttribute("y2", Y(e));
    ln.setAttribute("stroke", "#26304a"); svg.appendChild(ln);
    const tx = document.createElementNS(NSVG, "text");
    tx.setAttribute("x", 2); tx.setAttribute("y", Y(e) + 4);
    tx.setAttribute("fill", "#8a94b0"); tx.setAttribute("font-size", "11");
    tx.textContent = Math.round(e) + "m"; svg.appendChild(tx);
  }
  for (let bi = 0; bi < blocks.length; bi++) {   // une courbe par journee
    const b = blocks[bi];
    const dp = b.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" ");
    const pl = document.createElementNS(NSVG, "polyline");
    pl.setAttribute("points", dp); pl.setAttribute("fill", "none");
    pl.setAttribute("stroke", prColor(b.d)); pl.setAttribute("stroke-width", "2");
    svg.appendChild(pl);
    if (bi > 0) {                        // separateur discret entre journees
      const sx = X(b.t0);
      const sl = document.createElementNS(NSVG, "line");
      sl.setAttribute("x1", sx); sl.setAttribute("x2", sx);
      sl.setAttribute("y1", 4); sl.setAttribute("y2", H - 16);
      sl.setAttribute("stroke", "#39445c");
      sl.setAttribute("stroke-dasharray", "3 4"); svg.appendChild(sl);
    }
  }
  profilCursor();
}
function profilCursor() {
  if (!profilOn || !prMap || !media[sel]) return;
  const svg = document.getElementById("prSvg");
  svg.querySelectorAll(".prCur").forEach(x => x.remove());
  const t = photoEpoch(media[sel]);
  if (t === null) return;
  // v5.14.2 : journee la plus PROCHE, puis position bornee aux bornes
  // de la trace -> le curseur reste visible au DEBUT de la courbe pour
  // une photo prise avant l'allumage du GPS, et a la FIN pour une photo
  // prise apres l'extinction (au lieu de disparaitre).
  let blk = prMap.blocks.find(b => t >= b.t0 && t <= b.t1);
  if (!blk) {
    let bd = Infinity;
    for (const b of prMap.blocks) {
      const dd = t < b.t0 ? b.t0 - t : t - b.t1;
      if (dd < bd) { bd = dd; blk = b; }
    }
    if (!blk) return;
  }
  const tc = Math.min(Math.max(t, blk.t0), blk.t1);   // heure bornee dans la trace
  const x = 42 + (blk.off + (tc - blk.t0)) / prMap.Vtot * (prMap.W - 54);
  // altitude interpolee dans la journee (a l'heure bornee tc)
  let e = blk.pts[0][1];
  for (let i = 0; i < blk.pts.length; i++)
    if (blk.pts[i][0] >= tc) {
      if (i === 0) e = blk.pts[0][1];
      else { const [t1, e1] = blk.pts[i - 1], [t2, e2] = blk.pts[i];
             e = e1 + (e2 - e1) * (tc - t1) / (t2 - t1); }
      break;
    }
  const ln = document.createElementNS(NSVG, "line");
  ln.setAttribute("class", "prCur");
  ln.setAttribute("x1", x); ln.setAttribute("x2", x);
  ln.setAttribute("y1", 4); ln.setAttribute("y2", prMap.Y(prMap.emin));
  ln.setAttribute("stroke", "#ff7a00"); ln.setAttribute("stroke-width", "2");
  svg.appendChild(ln);
  const dot = document.createElementNS(NSVG, "circle");
  dot.setAttribute("class", "prCur");
  dot.setAttribute("cx", x); dot.setAttribute("cy", prMap.Y(e));
  dot.setAttribute("r", 5); dot.setAttribute("fill", "#ff7a00");
  svg.appendChild(dot);
  const tx = document.createElementNS(NSVG, "text");
  tx.setAttribute("class", "prCur");
  tx.setAttribute("x", Math.min(x + 6, svg.clientWidth - 46));
  tx.setAttribute("y", prMap.Y(e) - 8);
  tx.setAttribute("fill", "#ffb066"); tx.setAttribute("font-size", "12");
  tx.setAttribute("font-weight", "700");
  tx.textContent = Math.round(e) + "m"; svg.appendChild(tx);
}
document.getElementById("prSvg").addEventListener("click", e => {
  // clic inverse : ouvrir la photo la plus proche de l'horodatage clique
  // v5.14.1 : px -> position sur l'axe virtuel contigu -> journee + heure
  if (!prMap) return;
  const r = e.currentTarget.getBoundingClientRect();
  const u = ((e.clientX - r.left) - 42) / (r.width - 54) * prMap.Vtot;
  let blk = null;
  for (const b of prMap.blocks)
    if (u >= b.off && u <= b.off + b.dur) { blk = b; break; }
  if (!blk) return;
  const t = blk.t0 + (u - blk.off);
  let best = -1, bd = Infinity;
  for (let i = 0; i < media.length; i++) {
    const pt = photoEpoch(media[i]);
    if (pt === null) continue;
    const d = Math.abs(pt - t);
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0 && bd < 90 * 60 * 1000) openGal(best);   // sinon : clic trop loin de toute photo
});

  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  // seuil 60 px ET majoritairement horizontal (pour ne pas confondre
  // avec un appui sur les commandes video, ni avec un scroll vertical)
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5)
    openGal(dx < 0 ? sel + 1 : sel - 1);   // glisse a gauche => suivant
});
// ---------- poignee de redimensionnement galerie <-> carte ----------
const splitEl = document.getElementById("split");
let splitDrag = null;
splitEl.addEventListener("pointerdown", e => {
  // en portrait (layout colonne), la poignee agit sur la HAUTEUR
  const col = getComputedStyle(document.getElementById("wrap"))
    .flexDirection.includes("column");
  splitDrag = col
    ? { col: true, y: e.clientY, w: side.getBoundingClientRect().height }
    : { col: false, x: e.clientX, w: side.getBoundingClientRect().width };
  splitEl.classList.add("on");
  splitEl.setPointerCapture(e.pointerId);
  e.preventDefault();
});
splitEl.addEventListener("pointermove", e => {
  if (!splitDrag) return;
  userResized = true;   // desormais l'utilisateur garde la main sur la largeur
  setSideW(splitDrag.w + (splitDrag.col
    ? e.clientY - splitDrag.y
    : e.clientX - splitDrag.x));
});
splitEl.addEventListener("pointerup", () => {
  if (!splitDrag) return;
  splitDrag = null; splitEl.classList.remove("on");
  render();   // la carte a change de taille : recalcul complet
});
document.getElementById("prev").onclick = () => openGal(sel - 1);
document.getElementById("next").onclick = () => openGal(sel + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") openGal(sel - 1);
  else if (e.key === "ArrowRight") openGal(sel + 1);
});

// ---------- chargement des cumulatifs ----------
async function fetchJ(name) {
  // parametre anti-cache : chaque ouverture de page retelecharge les
  // cumulatifs a jour (sinon le navigateur sert la version en cache,
  // ex. apres une purge les anciennes dates restent affichees)
  const r = await fetch(BASE + "/" + name + "?v=" + Date.now());
  if (!r.ok) throw new Error(name + " : HTTP " + r.status);
  return r.json();
}
function fail(msg) { errEl.textContent = "Erreur de chargement : " + msg; errEl.style.display = "block"; }
async function load() {
  try {
    media = [];
    for (const [f, type] of [["photos.geojson", "photo"], ["videos.geojson", "video"]]) {
      let j; try { j = await fetchJ(f); } catch (e) { if (type === "video") continue; throw e; }
      for (const ft of (j.features || [])) {
        const p = ft.properties || {};
        media.push({
          type, name: p.name || "", date: p.date || "", commentaire: p.commentaire || "",
          url: p.url || "", lon: ft.geometry.coordinates[0], lat: ft.geometry.coordinates[1],
          color: ((p._umap_options || p._storage_options || {}).color) || "#3388ff"
        });
      }
    }
    media.sort((a, b) => (a.date + "|" + a.name).localeCompare(b.date + "|" + b.name));
    media.forEach((m, i) => m.i = i);
    try { traces = (await fetchJ("trace.geojson")).features || []; } catch (e) { traces = []; }
    if (media.length) {
      let n = 90, s = -90, w = 180, e = -180;
      for (const m of media) { n = Math.max(n, m.lat); s = Math.min(s, m.lat); w = Math.min(w, m.lon); e = Math.max(e, m.lon); }
      clat = (n + s) / 2; clon = (w + e) / 2;
      for (zoom = ZMAX; zoom > ZMIN; zoom--) {
        const dx = Math.abs(lon2x(e, zoom) - lon2x(w, zoom));
        const dy = Math.abs(lat2y(s, zoom) - lat2y(n, zoom));
        if (dx < mapEl.clientWidth * 0.85 && dy < mapEl.clientHeight * 0.85) break;
      }
      // zoom intermediaire : +7 niveaux au-dessus du cadrage global
      // (reglage empirique valide par l'utilisateur)
      zoom = Math.min(ZMAX, zoom + 7);
    }
    render();
    // commentaires : la page lit photos.csv en direct (source de verite),
    // puis ouvre la galerie sur la journee la plus RECENTE
    await loadComments();
    buildDateMenu();
    if (media.length) {
      const lastDate = [...new Set(media.map(m => m.date))].sort().pop();
      openGal(media.findIndex(m => m.date === lastDate));
    }
    // v5.16 : a l'ouverture sur SMARTPHONE (2F), demarrer directement
    // en mode "3 FENETRES" (photo+carte+alti = bouton ⛰ de la carte actif)
    if (MOBILE && !wrapEl.classList.contains("single")) {
      await openProfil();
      centerActive();
    }
  } catch (e) { fail(e.message); }
}
window.addEventListener("resize", render);
load();
</script>
